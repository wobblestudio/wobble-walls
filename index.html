<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Wobble Walls</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: #050510;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #game-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <script>
        // ============================================
        // WOBBLE WALLS - Taller + Sound + Top Spawn
        // ============================================

        const W = 720;
        const H = 1100;          // much taller for phone

        // Path starts from TOP
        const PATH = [
            {x: 360, y: -40},
            {x: 360, y: 220},
            {x: 160, y: 220},
            {x: 160, y: 480},
            {x: 520, y: 480},
            {x: 520, y: 720},
            {x: 280, y: 720},
            {x: 280, y: 980},
            {x: 360, y: 1140}
        ];

        const TOWERS = {
            archer: { name: "Neon Archer", cost: 50, range: 150, dmg: 15, rate: 520, color: 0x00e5ff, bullet: 480 },
            mage:   { name: "Arcane Mage", cost: 85, range: 130, dmg: 10, rate: 820, color: 0xff2d95, bullet: 320 },
            tesla:  { name: "Tesla Coil",  cost: 130, range: 145, dmg: 24, rate: 980, color: 0xffee00, bullet: 550 }
        };

        const ENEMIES = {
            goblin: { hp: 48, speed: 78,  reward: 9,  color: 0x39ff14, size: 12 },
            runner: { hp: 30, speed: 140, reward: 7,  color: 0x00ffcc, size: 9  },
            orc:    { hp: 140, speed: 50, reward: 19, color: 0xff3355, size: 16 },
            bat:    { hp: 40, speed: 110, reward: 12, color: 0xb14eff, size: 11 },
            drone:  { hp: 95, speed: 65,  reward: 16, color: 0xffaa00, size: 14 }
        };

        // Simple Web Audio sounds
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playTone(freq, duration, type = "square", volume = 0.08) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function sfxShoot()  { playTone(680, 0.07, "square", 0.06); }
        function sfxHit()    { playTone(180, 0.12, "sawtooth", 0.07); }
        function sfxDeath()  { playTone(120, 0.18, "triangle", 0.09); }
        function sfxWave()   { playTone(440, 0.15, "sine", 0.08); playTone(660, 0.2, "sine", 0.06); }
        function sfxPlace()  { playTone(520, 0.1, "triangle", 0.07); }

        class GameScene extends Phaser.Scene {
            constructor() { super("Game"); }

            init() {
                this.gold = 200;
                this.lives = 20;
                this.wave = 0;
                this.enemies = [];
                this.towers = [];
                this.bullets = [];
                this.selected = "archer";
                this.waveActive = false;
                this.spawnLeft = 0;
                this.spawnTimer = 0;
            }

            create() {
                // Resume audio on first tap
                this.input.once("pointerdown", () => {
                    if (audioCtx.state === "suspended") audioCtx.resume();
                });

                this.add.rectangle(W/2, H/2, W, H, 0x07071a);

                // Path
                const g = this.add.graphics();
                g.lineStyle(34, 0x00e5ff, 0.06);
                g.beginPath();
                g.moveTo(PATH[0].x, PATH[0].y);
                for (let i = 1; i < PATH.length; i++) g.lineTo(PATH[i].x, PATH[i].y);
                g.strokePath();

                g.lineStyle(20, 0x101028, 1);
                g.beginPath();
                g.moveTo(PATH[0].x, PATH[0].y);
                for (let i = 1; i < PATH.length; i++) g.lineTo(PATH[i].x, PATH[i].y);
                g.strokePath();

                g.lineStyle(3, 0x00e5ff, 0.5);
                g.beginPath();
                g.moveTo(PATH[0].x, PATH[0].y);
                for (let i = 1; i < PATH.length; i++) g.lineTo(PATH[i].x, PATH[i].y);
                g.strokePath();

                // Top bar
                this.add.rectangle(W/2, 32, W, 64, 0x0c0c1c, 0.95);
                this.add.rectangle(W/2, 64, W, 2, 0x00e5ff, 0.3);

                this.goldText  = this.add.text(18, 18, "GOLD  200",  { fontSize: "17px", color: "#ffd700", fontStyle: "bold" });
                this.livesText = this.add.text(150, 18, "LIVES  20", { fontSize: "17px", color: "#ff4d6d", fontStyle: "bold" });
                this.waveText  = this.add.text(290, 18, "WAVE  0",   { fontSize: "17px", color: "#00e5ff", fontStyle: "bold" });

                this.makeBtn(480, 32, "archer", "ARCHER\n50");
                this.makeBtn(580, 32, "mage",   "MAGE\n85");
                this.makeBtn(680, 32, "tesla",  "TESLA\n130");

                // Start button
                this.startBtn = this.add.text(W/2, H - 40, "▶  START WAVE", {
                    fontSize: "20px",
                    color: "#00ff9d",
                    backgroundColor: "#003d2e",
                    padding: { x: 22, y: 12 }
                }).setOrigin(0.5).setInteractive({ useHandCursor: true });

                this.startBtn.on("pointerdown", () => this.startWave());
                this.startBtn.on("pointerover", () => this.startBtn.setStyle({ backgroundColor: "#005c42" }));
                this.startBtn.on("pointerout",  () => this.startBtn.setStyle({ backgroundColor: "#003d2e" }));

                this.input.on("pointerdown", (p) => {
                    if (p.y > 80 && p.y < H - 90) this.tryPlace(p.x, p.y);
                });

                this.add.text(W/2, H/2, "WOBBLE WALLS", {
                    fontSize: "42px",
                    color: "#00e5ff",
                    fontStyle: "bold"
                }).setOrigin(0.5).setAlpha(0.05);
            }

            makeBtn(x, y, key, label) {
                const btn = this.add.text(x, y, label, {
                    fontSize: "12px",
                    color: "#e0e0ff",
                    backgroundColor: "#1a1a35",
                    padding: { x: 10, y: 6 },
                    align: "center"
                }).setOrigin(0.5).setInteractive({ useHandCursor: true });

                btn.on("pointerdown", () => {
                    this.selected = key;
                    this.children.list.forEach(c => {
                        if (c.type === "Text" && c.text.includes("\n")) c.setBackgroundColor("#1a1a35");
                    });
                    btn.setBackgroundColor("#003d55");
                });
                if (key === "archer") btn.setBackgroundColor("#003d55");
            }

            tryPlace(x, y) {
                const t = TOWERS[this.selected];
                if (this.gold < t.cost) return;

                for (let i = 0; i < PATH.length - 1; i++) {
                    if (this.distToLine(x, y, PATH[i], PATH[i+1]) < 36) return;
                }
                for (const tw of this.towers) {
                    if (Phaser.Math.Distance.Between(x, y, tw.x, tw.y) < 46) return;
                }

                this.gold -= t.cost;
                this.goldText.setText("GOLD  " + this.gold);
                sfxPlace();

                const base = this.add.circle(x, y, 17, 0x111122);
                const core = this.add.circle(x, y, 11, t.color);
                const glow = this.add.circle(x, y, 20, t.color, 0.2);
                const range = this.add.circle(x, y, t.range, t.color, 0.05);

                this.towers.push({ x, y, data: t, last: 0, core, glow, range });
            }

            distToLine(px, py, a, b) {
                const dx = b.x - a.x, dy = b.y - a.y;
                const len = dx*dx + dy*dy || 1;
                let t = ((px-a.x)*dx + (py-a.y)*dy) / len;
                t = Phaser.Math.Clamp(t, 0, 1);
                return Phaser.Math.Distance.Between(px, py, a.x + t*dx, a.y + t*dy);
            }

            startWave() {
                if (this.waveActive) return;
                this.wave++;
                this.waveText.setText("WAVE  " + this.wave);
                this.waveActive = true;
                this.spawnLeft = 6 + this.wave * 2;
                this.spawnTimer = 0;
                sfxWave();
            }

            spawn() {
                const keys = Object.keys(ENEMIES);
                let key = keys[0];
                if (this.wave >= 3) key = keys[Phaser.Math.Between(0, 1)];
                if (this.wave >= 5) key = keys[Phaser.Math.Between(0, 2)];
                if (this.wave >= 7) key = keys[Phaser.Math.Between(0, 4)];

                const d = ENEMIES[key];
                const mult = 1 + (this.wave - 1) * 0.23;

                const body = this.add.circle(PATH[0].x, PATH[0].y, d.size, d.color);
                const ring = this.add.circle(PATH[0].x, PATH[0].y, d.size + 4, d.color, 0.28);

                this.enemies.push({
                    x: PATH[0].x, y: PATH[0].y,
                    hp: d.hp * mult, max: d.hp * mult,
                    speed: d.speed, reward: d.reward,
                    idx: 0, body, ring
                });
            }

            update(time, delta) {
                if (this.waveActive && this.spawnLeft > 0) {
                    this.spawnTimer += delta;
                    if (this.spawnTimer > 620) {
                        this.spawn();
                        this.spawnLeft--;
                        this.spawnTimer = 0;
                    }
                }

                // Move enemies
                for (let i = this.enemies.length - 1; i >= 0; i--) {
                    const e = this.enemies[i];
                    const next = PATH[e.idx + 1];
                    if (!next) {
                        this.lives--;
                        this.livesText.setText("LIVES  " + this.lives);
                        e.body.destroy(); e.ring.destroy();
                        this.enemies.splice(i, 1);
                        if (this.lives <= 0) this.gameOver();
                        continue;
                    }

                    const dist = Phaser.Math.Distance.Between(e.x, e.y, next.x, next.y);
                    if (dist < 5) {
                        e.idx++;
                    } else {
                        const ang = Phaser.Math.Angle.Between(e.x, e.y, next.x, next.y);
                        e.x += Math.cos(ang) * e.speed * delta / 1000;
                        e.y += Math.sin(ang) * e.speed * delta / 1000;
                        e.body.setPosition(e.x, e.y);
                        e.ring.setPosition(e.x, e.y);
                    }
                }

                // Towers shoot
                for (const tw of this.towers) {
                    if (time - tw.last < tw.data.rate) continue;
                    let target = null, best = tw.data.range;
                    for (const e of this.enemies) {
                        const d = Phaser.Math.Distance.Between(tw.x, tw.y, e.x, e.y);
                        if (d < best) { best = d; target = e; }
                    }
                    if (target) {
                        this.fire(tw, target);
                        tw.last = time;
                        sfxShoot();
                    }
                }

                // Bullets
                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    const b = this.bullets[i];
                    if (!b.target || !b.target.body.active) {
                        b.gfx.destroy();
                        this.bullets.splice(i, 1);
                        continue;
                    }
                    const ang = Phaser.Math.Angle.Between(b.x, b.y, b.target.x, b.target.y);
                    b.x += Math.cos(ang) * b.spd * delta / 1000;
                    b.y += Math.sin(ang) * b.spd * delta / 1000;
                    b.gfx.setPosition(b.x, b.y);

                    if (Phaser.Math.Distance.Between(b.x, b.y, b.target.x, b.target.y) < 13) {
                        b.target.hp -= b.dmg;
                        b.gfx.destroy();
                        this.bullets.splice(i, 1);
                        sfxHit();

                        if (b.target.hp <= 0) {
                            this.gold += b.target.reward;
                            this.goldText.setText("GOLD  " + this.gold);
                            b.target.body.destroy();
                            b.target.ring.destroy();
                            const idx = this.enemies.indexOf(b.target);
                            if (idx > -1) this.enemies.splice(idx, 1);
                            sfxDeath();
                        }
                    }
                }

                if (this.waveActive && this.spawnLeft <= 0 && this.enemies.length === 0) {
                    this.waveActive = false;
                    this.gold += 25 + this.wave * 8;
                    this.goldText.setText("GOLD  " + this.gold);
                }
            }

            fire(tw, target) {
                const gfx = this.add.circle(tw.x, tw.y, 4, 0xffffff);
                this.bullets.push({
                    x: tw.x, y: tw.y,
                    target, dmg: tw.data.dmg, spd: tw.data.bullet, gfx
                });
            }

            gameOver() {
                this.add.rectangle(W/2, H/2, W, H, 0x000000, 0.75);
                this.add.text(W/2, H/2 - 30, "GAME OVER", {
                    fontSize: "56px", color: "#ff2d55", fontStyle: "bold"
                }).setOrigin(0.5);
                this.add.text(W/2, H/2 + 30, "Refresh to restart", {
                    fontSize: "18px", color: "#aaaaaa"
                }).setOrigin(0.5);
                this.input.off("pointerdown");
                this.startBtn.disableInteractive();
            }
        }

        new Phaser.Game({
            type: Phaser.AUTO,
            width: W,
            height: H,
            parent: "game-container",
            backgroundColor: "#07071a",
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH
            },
            scene: [GameScene]
        });
    </script>
</body>
</html>
