<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Wobble Walls</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: #050510;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #game-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <script>
        // ============================================
        // WOBBLE WALLS - Improved Visual MVP
        // Cyber-Fantasy Neon Tower Defense
        // ============================================

        const W = 960;
        const H = 640;

        // Cleaner path
        const PATH = [
            {x: -50, y: 300},
            {x: 180, y: 300},
            {x: 180, y: 160},
            {x: 420, y: 160},
            {x: 420, y: 460},
            {x: 680, y: 460},
            {x: 680, y: 260},
            {x: 1010, y: 260}
        ];

        const TOWERS = {
            archer: { name: "Neon Archer", cost: 50, range: 155, dmg: 14, rate: 550, color: 0x00e5ff, bullet: 450 },
            mage:   { name: "Arcane Mage", cost: 85, range: 135, dmg: 9,  rate: 850, color: 0xff2d95, bullet: 300 },
            tesla:  { name: "Tesla Coil",  cost: 130, range: 145, dmg: 22, rate: 1000, color: 0xffee00, bullet: 520 }
        };

        const ENEMIES = {
            goblin: { hp: 45, speed: 75,  reward: 9,  color: 0x39ff14, size: 11 },
            runner: { hp: 28, speed: 135, reward: 7,  color: 0x00ffcc, size: 9  },
            orc:    { hp: 130, speed: 48, reward: 18, color: 0xff3355, size: 15 },
            bat:    { hp: 38, speed: 105, reward: 11, color: 0xb14eff, size: 10 },
            drone:  { hp: 90, speed: 62,  reward: 15, color: 0xffaa00, size: 13 }
        };

        class GameScene extends Phaser.Scene {
            constructor() { super("Game"); }

            init() {
                this.gold = 200;
                this.lives = 20;
                this.wave = 0;
                this.enemies = [];
                this.towers = [];
                this.bullets = [];
                this.selected = "archer";
                this.waveActive = false;
                this.spawnLeft = 0;
                this.spawnTimer = 0;
            }

            create() {
                // Dark background with subtle grid
                this.add.rectangle(W/2, H/2, W, H, 0x07071a);

                // Path (glow style)
                const g = this.add.graphics();
                // Outer glow
                g.lineStyle(36, 0x00e5ff, 0.07);
                g.beginPath();
                g.moveTo(PATH[0].x, PATH[0].y);
                for (let i = 1; i < PATH.length; i++) g.lineTo(PATH[i].x, PATH[i].y);
                g.strokePath();

                // Main path
                g.lineStyle(22, 0x12122e, 1);
                g.beginPath();
                g.moveTo(PATH[0].x, PATH[0].y);
                for (let i = 1; i < PATH.length; i++) g.lineTo(PATH[i].x, PATH[i].y);
                g.strokePath();

                // Neon edge
                g.lineStyle(3, 0x00e5ff, 0.55);
                g.beginPath();
                g.moveTo(PATH[0].x, PATH[0].y);
                for (let i = 1; i < PATH.length; i++) g.lineTo(PATH[i].x, PATH[i].y);
                g.strokePath();

                // Top UI bar
                this.add.rectangle(W/2, 28, W, 56, 0x0d0d1f, 0.95);
                this.add.rectangle(W/2, 56, W, 2, 0x00e5ff, 0.25);

                this.goldText = this.add.text(24, 16, "GOLD  200", { fontSize: "18px", color: "#ffd700", fontStyle: "bold" });
                this.livesText = this.add.text(170, 16, "LIVES  20", { fontSize: "18px", color: "#ff4d6d", fontStyle: "bold" });
                this.waveText = this.add.text(320, 16, "WAVE  0", { fontSize: "18px", color: "#00e5ff", fontStyle: "bold" });

                // Tower select buttons
                this.makeBtn(620, 28, "archer", "ARCHER\n50");
                this.makeBtn(730, 28, "mage", "MAGE\n85");
                this.makeBtn(840, 28, "tesla", "TESLA\n130");

                // Start button
                this.startBtn = this.add.text(W/2, H - 32, "▶  START WAVE", {
                    fontSize: "20px",
                    color: "#00ff9d",
                    backgroundColor: "#003d2e",
                    padding: { x: 20, y: 10 }
                }).setOrigin(0.5).setInteractive({ useHandCursor: true });

                this.startBtn.on("pointerdown", () => this.startWave());
                this.startBtn.on("pointerover", () => this.startBtn.setStyle({ backgroundColor: "#005c42" }));
                this.startBtn.on("pointerout", () => this.startBtn.setStyle({ backgroundColor: "#003d2e" }));

                // Placement
                this.input.on("pointerdown", (p) => {
                    if (p.y > 70 && p.y < H - 70) this.tryPlace(p.x, p.y);
                });

                // Watermark
                this.add.text(W/2, H/2, "WOBBLE WALLS", {
                    fontSize: "52px",
                    color: "#00e5ff",
                    fontStyle: "bold"
                }).setOrigin(0.5).setAlpha(0.06);
            }

            makeBtn(x, y, key, label) {
                const btn = this.add.text(x, y, label, {
                    fontSize: "13px",
                    color: "#e0e0ff",
                    backgroundColor: "#1a1a35",
                    padding: { x: 12, y: 7 },
                    align: "center"
                }).setOrigin(0.5).setInteractive({ useHandCursor: true });

                btn.on("pointerdown", () => {
                    this.selected = key;
                    this.children.list.forEach(c => {
                        if (c.type === "Text" && c.text.includes("\n")) c.setBackgroundColor("#1a1a35");
                    });
                    btn.setBackgroundColor("#003d55");
                });

                if (key === "archer") btn.setBackgroundColor("#003d55");
            }

            tryPlace(x, y) {
                const t = TOWERS[this.selected];
                if (this.gold < t.cost) return;

                // Keep away from path
                for (let i = 0; i < PATH.length - 1; i++) {
                    if (this.distToLine(x, y, PATH[i], PATH[i+1]) < 38) return;
                }
                // Keep away from other towers
                for (const tw of this.towers) {
                    if (Phaser.Math.Distance.Between(x, y, tw.x, tw.y) < 48) return;
                }

                this.gold -= t.cost;
                this.goldText.setText("GOLD  " + this.gold);

                // Visual tower
                const base = this.add.circle(x, y, 18, 0x111122);
                const core = this.add.circle(x, y, 12, t.color);
                const glow = this.add.circle(x, y, 22, t.color, 0.18);
                const range = this.add.circle(x, y, t.range, t.color, 0.06);

                this.towers.push({
                    x, y,
                    data: t,
                    last: 0,
                    core, glow, range
                });
            }

            distToLine(px, py, a, b) {
                const dx = b.x - a.x, dy = b.y - a.y;
                const len = dx*dx + dy*dy;
                let t = ((px-a.x)*dx + (py-a.y)*dy) / len;
                t = Phaser.Math.Clamp(t, 0, 1);
                return Phaser.Math.Distance.Between(px, py, a.x + t*dx, a.y + t*dy);
            }

            startWave() {
                if (this.waveActive) return;
                this.wave++;
                this.waveText.setText("WAVE  " + this.wave);
                this.waveActive = true;
                this.spawnLeft = 5 + this.wave * 2;
                this.spawnTimer = 0;
            }

            spawn() {
                const keys = Object.keys(ENEMIES);
                let key = keys[0];
                if (this.wave >= 3) key = keys[Phaser.Math.Between(0, 1)];
                if (this.wave >= 5) key = keys[Phaser.Math.Between(0, 2)];
                if (this.wave >= 7) key = keys[Phaser.Math.Between(0, 4)];

                const d = ENEMIES[key];
                const mult = 1 + (this.wave - 1) * 0.22;

                const body = this.add.circle(PATH[0].x, PATH[0].y, d.size, d.color);
                const ring = this.add.circle(PATH[0].x, PATH[0].y, d.size + 4, d.color, 0.25);

                this.enemies.push({
                    x: PATH[0].x, y: PATH[0].y,
                    hp: d.hp * mult,
                    max: d.hp * mult,
                    speed: d.speed,
                    reward: d.reward,
                    idx: 0,
                    body, ring
                });
            }

            update(time, delta) {
                // Spawn
                if (this.waveActive && this.spawnLeft > 0) {
                    this.spawnTimer += delta;
                    if (this.spawnTimer > 650) {
                        this.spawn();
                        this.spawnLeft--;
                        this.spawnTimer = 0;
                    }
                }

                // Move enemies
                for (let i = this.enemies.length - 1; i >= 0; i--) {
                    const e = this.enemies[i];
                    const next = PATH[e.idx + 1];
                    if (!next) {
                        this.lives--;
                        this.livesText.setText("LIVES  " + this.lives);
                        e.body.destroy(); e.ring.destroy();
                        this.enemies.splice(i, 1);
                        if (this.lives <= 0) this.gameOver();
                        continue;
                    }

                    const dist = Phaser.Math.Distance.Between(e.x, e.y, next.x, next.y);
                    if (dist < 5) {
                        e.idx++;
                    } else {
                        const ang = Phaser.Math.Angle.Between(e.x, e.y, next.x, next.y);
                        e.x += Math.cos(ang) * e.speed * delta / 1000;
                        e.y += Math.sin(ang) * e.speed * delta / 1000;
                        e.body.setPosition(e.x, e.y);
                        e.ring.setPosition(e.x, e.y);
                    }
                }

                // Towers attack
                for (const tw of this.towers) {
                    if (time - tw.last < tw.data.rate) continue;
                    let target = null, best = tw.data.range;
                    for (const e of this.enemies) {
                        const d = Phaser.Math.Distance.Between(tw.x, tw.y, e.x, e.y);
                        if (d < best) { best = d; target = e; }
                    }
                    if (target) {
                        this.fire(tw, target);
                        tw.last = time;
                    }
                }

                // Bullets
                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    const b = this.bullets[i];
                    if (!b.target || !b.target.body.active) {
                        b.gfx.destroy();
                        this.bullets.splice(i, 1);
                        continue;
                    }
                    const ang = Phaser.Math.Angle.Between(b.x, b.y, b.target.x, b.target.y);
                    b.x += Math.cos(ang) * b.spd * delta / 1000;
                    b.y += Math.sin(ang) * b.spd * delta / 1000;
                    b.gfx.setPosition(b.x, b.y);

                    if (Phaser.Math.Distance.Between(b.x, b.y, b.target.x, b.target.y) < 14) {
                        b.target.hp -= b.dmg;
                        b.gfx.destroy();
                        this.bullets.splice(i, 1);

                        if (b.target.hp <= 0) {
                            this.gold += b.target.reward;
                            this.goldText.setText("GOLD  " + this.gold);
                            b.target.body.destroy();
                            b.target.ring.destroy();
                            const idx = this.enemies.indexOf(b.target);
                            if (idx > -1) this.enemies.splice(idx, 1);
                        }
                    }
                }

                // Wave finished
                if (this.waveActive && this.spawnLeft <= 0 && this.enemies.length === 0) {
                    this.waveActive = false;
                    this.gold += 20 + this.wave * 8;
                    this.goldText.setText("GOLD  " + this.gold);
                }
            }

            fire(tw, target) {
                const gfx = this.add.circle(tw.x, tw.y, 4, 0xffffff);
                this.bullets.push({
                    x: tw.x, y: tw.y,
                    target,
                    dmg: tw.data.dmg,
                    spd: tw.data.bullet,
                    gfx
                });
            }

            gameOver() {
                this.add.rectangle(W/2, H/2, W, H, 0x000000, 0.72);
                this.add.text(W/2, H/2 - 20, "GAME OVER", {
                    fontSize: "64px", color: "#ff2d55", fontStyle: "bold"
                }).setOrigin(0.5);
                this.add.text(W/2, H/2 + 40, "Refresh to restart", {
                    fontSize: "18px", color: "#aaaaaa"
                }).setOrigin(0.5);
                this.input.off("pointerdown");
                this.startBtn.disableInteractive();
            }
        }

        new Phaser.Game({
            type: Phaser.AUTO,
            width: W,
            height: H,
            parent: "game-container",
            backgroundColor: "#07071a",
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH
            },
            scene: [GameScene]
        });
    </script>
</body>
</html>
