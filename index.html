<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Wobble Walls</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: #050510; width: 100%; height: 100%; overflow: hidden; }
        #game-container { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script>
        const W = 720;
        const H = 1180;

        const PATH = [
            {x:360,y:-50},{x:360,y:180},{x:140,y:180},{x:140,y:420},
            {x:560,y:420},{x:560,y:680},{x:200,y:680},{x:200,y:920},
            {x:360,y:920},{x:360,y:1220}
        ];

        const TOWERS = {
            archer:  { name:"Neon Archer",  cost:50,  range:155, dmg:14, rate:500,  color:0x00e5ff, upCost:40,  maxLvl:3 },
            mage:    { name:"Arcane Mage",  cost:85,  range:135, dmg:11, rate:780,  color:0xff2d95, upCost:60,  maxLvl:3 },
            tesla:   { name:"Tesla Coil",   cost:130, range:145, dmg:22, rate:950,  color:0xffee00, upCost:90,  maxLvl:3 },
            cryo:    { name:"Cryo Turret",  cost:100, range:140, dmg:8,  rate:700,  color:0x66ccff, upCost:70,  maxLvl:3, slow:0.45 },
            toxic:   { name:"Toxic Spitter",cost:110, range:130, dmg:6,  rate:600,  color:0x39ff14, upCost:75,  maxLvl:3, dot:4 },
            plasma:  { name:"Plasma Cannon",cost:160, range:170, dmg:35, rate:1200, color:0xff6600, upCost:110, maxLvl:3 }
        };

        const ENEMIES = {
            goblin: { hp:50,  speed:80,  reward:9,  color:0x39ff14, size:12 },
            runner: { hp:32,  speed:145, reward:7,  color:0x00ffcc, size:9  },
            orc:    { hp:150, speed:48,  reward:20, color:0xff3355, size:16 },
            bat:    { hp:42,  speed:115, reward:12, color:0xb14eff, size:11 },
            drone:  { hp:100, speed:65,  reward:16, color:0xffaa00, size:14 },
            golem:  { hp:280, speed:35,  reward:35, color:0x8888ff, size:20 }
        };

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function tone(freq, dur, type="square", vol=0.07) {
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.type = type; o.frequency.value = freq;
            g.gain.setValueAtTime(vol, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
            o.start(); o.stop(audioCtx.currentTime + dur);
        }
        const sfx = {
            shoot: () => tone(720, 0.06),
            hit:   () => tone(200, 0.1, "sawtooth"),
            death: () => tone(110, 0.16, "triangle", 0.09),
            wave:  () => { tone(440,0.12,"sine"); tone(660,0.18,"sine",0.05); },
            place: () => tone(540, 0.09, "triangle"),
            up:    () => { tone(600,0.08); tone(900,0.12); }
        };

        class Game extends Phaser.Scene {
            constructor() { super("Game"); }

            init() {
                this.gold = 220;
                this.lives = 25;
                this.wave = 0;
                this.enemies = [];
                this.towers = [];
                this.bullets = [];
                this.selected = "archer";
                this.waveActive = false;
                this.spawnLeft = 0;
                this.spawnTimer = 0;
                this.paused = false;
                this.speed = 1;
                this.selectedTower = null;
            }

            create() {
                this.input.once("pointerdown", () => { if (audioCtx.state === "suspended") audioCtx.resume(); });

                this.add.rectangle(W/2, H/2, W, H, 0x07071a);

                // Path
                const g = this.add.graphics();
                g.lineStyle(32, 0x00e5ff, 0.05);
                g.beginPath(); g.moveTo(PATH[0].x, PATH[0].y);
                for (let i=1;i<PATH.length;i++) g.lineTo(PATH[i].x, PATH[i].y); g.strokePath();
                g.lineStyle(18, 0x0e0e24, 1);
                g.beginPath(); g.moveTo(PATH[0].x, PATH[0].y);
                for (let i=1;i<PATH.length;i++) g.lineTo(PATH[i].x, PATH[i].y); g.strokePath();
                g.lineStyle(2.5, 0x00e5ff, 0.45);
                g.beginPath(); g.moveTo(PATH[0].x, PATH[0].y);
                for (let i=1;i<PATH.length;i++) g.lineTo(PATH[i].x, PATH[i].y); g.strokePath();

                // Top UI
                this.add.rectangle(W/2, 36, W, 72, 0x0b0b1a, 0.95);
                this.add.rectangle(W/2, 72, W, 2, 0x00e5ff, 0.25);

                this.goldText  = this.add.text(16, 14, "GOLD 220",  { fontSize:"16px", color:"#ffd700", fontStyle:"bold" });
                this.livesText = this.add.text(140, 14, "LIVES 25", { fontSize:"16px", color:"#ff4d6d", fontStyle:"bold" });
                this.waveText  = this.add.text(270, 14, "WAVE 0",   { fontSize:"16px", color:"#00e5ff", fontStyle:"bold" });

                // Speed & Pause
                this.speedBtn = this.add.text(400, 22, "x1", {
                    fontSize:"15px", color:"#fff", backgroundColor:"#222244", padding:{x:10,y:5}
                }).setInteractive({useHandCursor:true});
                this.speedBtn.on("pointerdown", () => this.cycleSpeed());

                this.pauseBtn = this.add.text(460, 22, "PAUSE", {
                    fontSize:"15px", color:"#fff", backgroundColor:"#442222", padding:{x:10,y:5}
                }).setInteractive({useHandCursor:true});
                this.pauseBtn.on("pointerdown", () => this.togglePause());

                // Tower buttons
                const keys = Object.keys(TOWERS);
                keys.forEach((k, i) => {
                    const t = TOWERS[k];
                    const btn = this.add.text(70 + i*110, 52, t.name.split(" ")[1] + "\n" + t.cost, {
                        fontSize:"11px", color:"#ddd", backgroundColor:"#1a1a32",
                        padding:{x:8,y:4}, align:"center"
                    }).setOrigin(0.5).setInteractive({useHandCursor:true});
                    btn.on("pointerdown", () => {
                        this.selected = k;
                        this.selectedTower = null;
                        this.children.list.forEach(c => {
                            if (c.type==="Text" && c.text.includes("\n") && c.y===52) c.setBackgroundColor("#1a1a32");
                        });
                        btn.setBackgroundColor("#003d55");
                    });
                    if (k==="archer") btn.setBackgroundColor("#003d55");
                });

                // Start Wave
                this.startBtn = this.add.text(W/2, H-42, "▶ START WAVE", {
                    fontSize:"18px", color:"#00ff9d", backgroundColor:"#003d2e",
                    padding:{x:18,y:10}
                }).setOrigin(0.5).setInteractive({useHandCursor:true});
                this.startBtn.on("pointerdown", () => this.startWave());

                // Upgrade panel (hidden)
                this.upPanel = this.add.container(W/2, H-120).setVisible(false);
                this.upBg = this.add.rectangle(0, 0, 300, 70, 0x111122, 0.95);
                this.upText = this.add.text(0, -12, "", { fontSize:"14px", color:"#fff", align:"center" }).setOrigin(0.5);
                this.upBtn = this.add.text(0, 18, "UPGRADE", {
                    fontSize:"14px", color:"#00ff9d", backgroundColor:"#003322", padding:{x:12,y:5}
                }).setOrigin(0.5).setInteractive({useHandCursor:true});
                this.upBtn.on("pointerdown", () => this.upgradeTower());
                this.upPanel.add([this.upBg, this.upText, this.upBtn]);

                this.input.on("pointerdown", (p) => {
                    if (this.paused) return;
                    if (p.y > 90 && p.y < H-100) {
                        // Check click on existing tower
                        let clicked = null;
                        for (const tw of this.towers) {
                            if (Phaser.Math.Distance.Between(p.x, p.y, tw.x, tw.y) < 28) {
                                clicked = tw; break;
                            }
                        }
                        if (clicked) {
                            this.selectedTower = clicked;
                            this.showUpgrade(clicked);
                        } else {
                            this.selectedTower = null;
                            this.upPanel.setVisible(false);
                            this.tryPlace(p.x, p.y);
                        }
                    }
                });

                this.add.text(W/2, H/2, "WOBBLE WALLS", {
                    fontSize:"40px", color:"#00e5ff", fontStyle:"bold"
                }).setOrigin(0.5).setAlpha(0.04);
            }

            cycleSpeed() {
                this.speed = this.speed === 1 ? 2 : this.speed === 2 ? 3 : 1;
                this.speedBtn.setText("x" + this.speed);
            }

            togglePause() {
                this.paused = !this.paused;
                this.pauseBtn.setText(this.paused ? "RESUME" : "PAUSE");
                this.pauseBtn.setBackgroundColor(this.paused ? "#225522" : "#442222");
            }

            showUpgrade(tw) {
                const d = tw.data;
                const nextDmg = Math.floor(d.dmg * (1 + tw.lvl * 0.35));
                this.upText.setText(`\( {d.name}  Lv \){tw.lvl}\nDMG ${d.dmg} → ${nextDmg}   Cost ${d.upCost}`);
                this.upPanel.setVisible(tw.lvl < d.maxLvl);
            }

            upgradeTower() {
                const tw = this.selectedTower;
                if (!tw || tw.lvl >= tw.data.maxLvl) return;
                if (this.gold < tw.data.upCost) return;
                this.gold -= tw.data.upCost;
                this.goldText.setText("GOLD " + this.gold);
                tw.lvl++;
                tw.data = Object.assign({}, tw.data);
                tw.data.dmg = Math.floor(tw.data.dmg * 1.35);
                tw.data.range = Math.floor(tw.data.range * 1.08);
                tw.core.setFillStyle(tw.data.color);
                tw.glow.setRadius(20 + tw.lvl * 3);
                sfx.up();
                this.showUpgrade(tw);
            }

            tryPlace(x, y) {
                const t = TOWERS[this.selected];
                if (this.gold < t.cost) return;
                for (let i=0; i<PATH.length-1; i++) {
                    if (this.distToLine(x,y,PATH[i],PATH[i+1]) < 34) return;
                }
                for (const tw of this.towers) {
                    if (Phaser.Math.Distance.Between(x,y,tw.x,tw.y) < 44) return;
                }
                this.gold -= t.cost;
                this.goldText.setText("GOLD " + this.gold);
                sfx.place();

                const base = this.add.circle(x, y, 16, 0x0f0f1c);
                const core = this.add.circle(x, y, 10, t.color);
                const glow = this.add.circle(x, y, 19, t.color, 0.22);
                const range = this.add.circle(x, y, t.range, t.color, 0.04);

                this.towers.push({
                    x, y, data: Object.assign({}, t), lvl: 1,
                    last: 0, core, glow, range, base
                });
            }

            distToLine(px,py,a,b) {
                const dx=b.x-a.x, dy=b.y-a.y, len=dx*dx+dy*dy||1;
                let t=((px-a.x)*dx+(py-a.y)*dy)/len;
                t=Phaser.Math.Clamp(t,0,1);
                return Phaser.Math.Distance.Between(px,py,a.x+t*dx,a.y+t*dy);
            }

            startWave() {
                if (this.waveActive || this.paused) return;
                this.wave++;
                this.waveText.setText("WAVE " + this.wave);
                this.waveActive = true;
                this.spawnLeft = 7 + this.wave * 2;
                this.spawnTimer = 0;
                sfx.wave();
            }

            spawn() {
                const keys = Object.keys(ENEMIES);
                let key = keys[0];
                if (this.wave >= 3) key = keys[Phaser.Math.Between(0,1)];
                if (this.wave >= 5) key = keys[Phaser.Math.Between(0,2)];
                if (this.wave >= 7) key = keys[Phaser.Math.Between(0,4)];
                if (this.wave >= 10) key = keys[Phaser.Math.Between(0,5)];

                const d = ENEMIES[key];
                const mult = 1 + (this.wave-1)*0.22;
                const body = this.add.circle(PATH[0].x, PATH[0].y, d.size, d.color);
                const ring = this.add.circle(PATH[0].x, PATH[0].y, d.size+3, d.color, 0.25);

                this.enemies.push({
                    x:PATH[0].x, y:PATH[0].y,
                    hp:d.hp*mult, max:d.hp*mult,
                    speed:d.speed, reward:d.reward,
                    idx:0, body, ring, slow:1, dot:0
                });
            }

            update(time, delta) {
                if (this.paused) return;
                delta *= this.speed;

                if (this.waveActive && this.spawnLeft > 0) {
                    this.spawnTimer += delta;
                    if (this.spawnTimer > 580) {
                        this.spawn(); this.spawnLeft--; this.spawnTimer=0;
                    }
                }

                // Enemies
                for (let i=this.enemies.length-1; i>=0; i--) {
                    const e = this.enemies[i];
                    if (e.dot > 0) { e.hp -= e.dot * delta/1000; }
                    const next = PATH[e.idx+1];
                    if (!next) {
                        this.lives--; this.livesText.setText("LIVES " + this.lives);
                        e.body.destroy(); e.ring.destroy();
                        this.enemies.splice(i,1);
                        if (this.lives <= 0) this.gameOver();
                        continue;
                    }
                    const dist = Phaser.Math.Distance.Between(e.x,e.y,next.x,next.y);
                    if (dist < 5) e.idx++;
                    else {
                        const ang = Phaser.Math.Angle.Between(e.x,e.y,next.x,next.y);
                        const spd = e.speed * e.slow;
                        e.x += Math.cos(ang)*spd*delta/1000;
                        e.y += Math.sin(ang)*spd*delta/1000;
                        e.body.setPosition(e.x,e.y);
                        e.ring.setPosition(e.x,e.y);
                    }
                    if (e.hp <= 0) {
                        this.gold += e.reward; this.goldText.setText("GOLD " + this.gold);
                        e.body.destroy(); e.ring.destroy();
                        this.enemies.splice(i,1); sfx.death();
                    }
                }

                // Towers
                for (const tw of this.towers) {
                    if (time - tw.last < tw.data.rate / this.speed) continue;
                    let target=null, best=tw.data.range;
                    for (const e of this.enemies) {
                        const d = Phaser.Math.Distance.Between(tw.x,tw.y,e.x,e.y);
                        if (d < best) { best=d; target=e; }
                    }
                    if (target) {
                        this.fire(tw, target);
                        tw.last = time;
                        sfx.shoot();
                    }
                }

                // Bullets
                for (let i=this.bullets.length-1; i>=0; i--) {
                    const b = this.bullets[i];
                    if (!b.target || !b.target.body.active) {
                        b.gfx.destroy(); this.bullets.splice(i,1); continue;
                    }
                    const ang = Phaser.Math.Angle.Between(b.x,b.y,b.target.x,b.target.y);
                    b.x += Math.cos(ang)*b.spd*delta/1000;
                    b.y += Math.sin(ang)*b.spd*delta/1000;
                    b.gfx.setPosition(b.x,b.y);

                    if (Phaser.Math.Distance.Between(b.x,b.y,b.target.x,b.target.y) < 12) {
                        b.target.hp -= b.dmg;
                        if (b.slow) b.target.slow = Math.min(b.target.slow, b.slow);
                        if (b.dot) b.target.dot = Math.max(b.target.dot, b.dot);
                        b.gfx.destroy(); this.bullets.splice(i,1); sfx.hit();
                    }
                }

                if (this.waveActive && this.spawnLeft<=0 && this.enemies.length===0) {
                    this.waveActive = false;
                    this.gold += 30 + this.wave*10;
                    this.goldText.setText("GOLD " + this.gold);
                }
            }

            fire(tw, target) {
                const gfx = this.add.circle(tw.x, tw.y, 4, 0xffffff);
                this.bullets.push({
                    x:tw.x, y:tw.y, target,
                    dmg:tw.data.dmg, spd:480,
                    slow:tw.data.slow || 0,
                    dot:tw.data.dot || 0,
                    gfx
                });
            }

            gameOver() {
                this.add.rectangle(W/2,H/2,W,H,0x000000,0.78);
                this.add.text(W/2,H/2-20,"GAME OVER",{fontSize:"52px",color:"#ff2d55",fontStyle:"bold"}).setOrigin(0.5);
                this.add.text(W/2,H/2+30,"Refresh to restart",{fontSize:"16px",color:"#aaa"}).setOrigin(0.5);
                this.input.off("pointerdown");
                this.startBtn.disableInteractive();
            }
        }

        new Phaser.Game({
            type: Phaser.AUTO,
            width: W,
            height: H,
            parent: "game-container",
            backgroundColor: "#07071a",
            scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
            scene: [Game]
        });
    </script>
</body>
</html>
