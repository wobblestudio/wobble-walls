<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Wobble Walls</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: #03030a; width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; }
        #game-container { width: 100%; height: 100%; }
        #ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: #03030a; z-index: 100; color: white; text-align: center; padding: 20px;
        }
        #ui-overlay.hidden { display: none; }
        .logo {
            width: 280px; max-width: 80%;
            margin-bottom: 18px;
            filter: drop-shadow(0 0 12px #00e5ff);
        }
        .desc {
            font-size: 14px; color: #88ccdd; max-width: 300px; line-height: 1.5; margin-bottom: 22px;
        }
        input {
            padding: 14px 20px; font-size: 17px; border: 2px solid #00e5ff; border-radius: 10px;
            background: #0a0a18; color: white; width: 260px; text-align: center; outline: none;
            margin-bottom: 8px;
        }
        button.main-btn {
            margin-top: 14px; padding: 14px 42px; font-size: 17px; font-weight: bold;
            background: #003d2e; color: white; border: 2px solid #00ff9d; border-radius: 10px; cursor: pointer;
        }
        button.main-btn:hover { background: #005c44; }
        .map-btn {
            margin: 8px; padding: 14px 28px; font-size: 15px; background: #0a0a18;
            border: 2px solid #00e5ff; color: #00e5ff; border-radius: 10px; cursor: pointer; width: 230px;
        }
        .map-btn:hover { background: #003344; }
        .credit {
            margin-top: 28px; font-size: 13px; color: #666;
        }
        .credit a { color: #00e5ff; text-decoration: none; }
        .highscore { margin-top: 12px; font-size: 14px; color: #ffd700; }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <div id="ui-overlay">
        <img src="https://iili.io/CQZ62p9.md.jpg" alt="Wobble Walls" class="logo">
        <div class="desc">
            A cyber-fantasy neon tower defense.<br>
            Build towers, survive endless waves,<br>
            and defend the kingdom.
        </div>
        <input type="text" id="usernameInput" placeholder="Enter your username" maxlength="12" autocomplete="off">
        <button class="main-btn" id="continueBtn">CONTINUE</button>
        <div class="highscore" id="highscoreText"></div>
        <div class="credit">
            Built by <a href="https://x.com/WoobleStudio" target="_blank">@WoobleStudio</a>
        </div>
    </div>

    <script>
        const W = 720;
        const H = 1280;
        const TILE = 56;

        const MAPS = {
            map1: {
                name: "Neon Valley",
                path: [
                    {x:360,y:170},{x:360,y:340},{x:160,y:340},{x:160,y:560},
                    {x:560,y:560},{x:560,y:780},{x:200,y:780},{x:200,y:1000},
                    {x:360,y:1000},{x:360,y:1220}
                ]
            },
            map2: {
                name: "Cyber Spiral",
                path: [
                    {x:200,y:180},{x:520,y:180},{x:520,y:400},{x:200,y:400},
                    {x:200,y:620},{x:520,y:620},{x:520,y:840},{x:200,y:840},
                    {x:200,y:1060},{x:360,y:1060},{x:360,y:1220}
                ]
            },
            map3: {
                name: "Void Corridor",
                path: [
                    {x:360,y:170},{x:360,y:300},{x:180,y:300},{x:180,y:500},
                    {x:540,y:500},{x:540,y:700},{x:180,y:700},{x:180,y:900},
                    {x:540,y:900},{x:540,y:1100},{x:360,y:1100},{x:360,y:1220}
                ]
            }
        };

        let currentMap = "map1";
        let PATH = MAPS.map1.path;
        let FINAL_SPOTS = [];

        function rebuildSpots() {
            const spots = [];
            for (let y = 170; y < 1200; y += TILE) {
                for (let x = 40; x < 680; x += TILE) {
                    spots.push({x: x + TILE/2, y: y + TILE/2});
                }
            }
            function distToPath(px, py) {
                let min = 9999;
                for (let i = 0; i < PATH.length - 1; i++) {
                    const a = PATH[i], b = PATH[i+1];
                    const dx = b.x - a.x, dy = b.y - a.y;
                    const len = dx*dx + dy*dy || 1;
                    let t = ((px - a.x)*dx + (py - a.y)*dy) / len;
                    t = Math.max(0, Math.min(1, t));
                    const dist = Math.hypot(px - (a.x + t*dx), py - (a.y + t*dy));
                    if (dist < min) min = dist;
                }
                return min;
            }
            FINAL_SPOTS = spots.filter(s => distToPath(s.x, s.y) > 42);
        }
        rebuildSpots();

        // ===== ELEMENT SYSTEM =====
        const TOWERS = {
            archer:   { name:"ARCHER",   cost:50,  mana:0,  range:150, dmg:14, rate:480,  color:0x00f0ff, upCost:40,  maxLvl:3, shot:"bullet", key:"archer",  element:"Physical" },
            mage:     { name:"MAGE",     cost:90,  mana:10, range:165, dmg:16, rate:700,  color:0xff2d95, upCost:70,  maxLvl:3, shot:"orb",    key:"mage",    element:"Arcane" },
            tesla:    { name:"TESLA",    cost:140, mana:15, range:180, dmg:28, rate:880,  color:0xffee00, upCost:100, maxLvl:3, shot:"laser",  key:"tesla",   element:"Lightning" },
            cryo:     { name:"CRYO",     cost:110, mana:12, range:170, dmg:12, rate:640,  color:0x66ccff, upCost:80,  maxLvl:3, shot:"ice",    key:"cryo",    element:"Ice", slow:0.45 },
            toxic:    { name:"TOXIC",    cost:120, mana:10, range:160, dmg:10, rate:550,  color:0x39ff14, upCost:85,  maxLvl:3, shot:"dot",    key:"toxic",   element:"Poison", dot:8 },
            plasma:   { name:"PLASMA",   cost:180, mana:20, range:200, dmg:45, rate:1050, color:0xff6600, upCost:130, maxLvl:3, shot:"plasma", key:"plasma",  element:"Fire", burn:6 },
            beacon:   { name:"BEACON",   cost:160, mana:25, range:140, dmg:0,  rate:9999, color:0xff99ff, upCost:110, maxLvl:3, shot:"buff",   key:"beacon",  element:"Holy" },
            drone:    { name:"DRONE",    cost:130, mana:15, range:190, dmg:22, rate:620,  color:0x00ffaa, upCost:95,  maxLvl:3, shot:"bullet", key:"drone",   element:"Physical" },
            totem:    { name:"TOTEM",    cost:150, mana:18, range:175, dmg:18, rate:750,  color:0xaa66ff, upCost:105, maxLvl:3, shot:"orb",    key:"totem",   element:"Dark" },
            dragon:   { name:"DRAGON",   cost:250, mana:40, range:220, dmg:70, rate:1400, color:0xff2200, upCost:180, maxLvl:3, shot:"plasma", key:"dragon",  element:"Fire", burn:12 }
        };

        const ENEMIES = {
            goblin: { hp:55,  speed:78,  reward:9,  size:28, key:"goblin" },
            runner: { hp:32,  speed:150, reward:7,  size:26, key:"runner" },
            orc:    { hp:160, speed:45,  reward:22, size:34, key:"orc" },
            bat:    { hp:45,  speed:120, reward:12, size:28, key:"bat" },
            drone:  { hp:110, speed:65,  reward:16, size:30, key:"drone_e" },
            golem:  { hp:300, speed:33,  reward:40, size:40, key:"golem" },
            boss:   { hp:1200, speed:28, reward:180, size:64, key:"boss", isBoss:true }
        };

        // ===== IMPROVED AUDIO =====
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let musicPlaying = false;
        let musicMuted = false;
        let musicNodes = [];

        function startBackgroundMusic() {
            if (musicPlaying) return;
            musicPlaying = true;

            // Deep drone
            const drone = audioCtx.createOscillator();
            const droneGain = audioCtx.createGain();
            drone.type = "sine";
            drone.frequency.value = 48;
            droneGain.gain.value = musicMuted ? 0 : 0.04;
            drone.connect(droneGain);
            droneGain.connect(audioCtx.destination);
            drone.start();

            // Soft pad
            const pad = audioCtx.createOscillator();
            const padGain = audioCtx.createGain();
            pad.type = "triangle";
            pad.frequency.value = 96;
            padGain.gain.value = musicMuted ? 0 : 0.018;
            pad.connect(padGain);
            padGain.connect(audioCtx.destination);
            pad.start();

            // Arpeggio
            const notes = [130.81, 164.81, 196.00, 246.94, 196.00, 164.81];
            let noteIdx = 0;
            const arp = audioCtx.createOscillator();
            const arpGain = audioCtx.createGain();
            arp.type = "sine";
            arp.frequency.value = notes[0];
            arpGain.gain.value = musicMuted ? 0 : 0.022;
            arp.connect(arpGain);
            arpGain.connect(audioCtx.destination);
            arp.start();

            const arpInterval = setInterval(() => {
                if (musicMuted) return;
                noteIdx = (noteIdx + 1) % notes.length;
                arp.frequency.setValueAtTime(notes[noteIdx], audioCtx.currentTime);
            }, 700);

            musicNodes = [
                { osc: drone, gain: droneGain },
                { osc: pad, gain: padGain },
                { osc: arp, gain: arpGain, interval: arpInterval }
            ];
        }

        function toggleMute() {
            musicMuted = !musicMuted;
            musicNodes.forEach(n => {
                if (n.gain) n.gain.gain.value = musicMuted ? 0 : (n.osc.frequency.value < 60 ? 0.04 : 0.02);
            });
            return musicMuted;
        }

        function tone(freq, dur, type="square", vol=0.08) {
            if (musicMuted && type !== "square") return; // keep SFX even if muted? optional
            try {
                const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                o.connect(g); g.connect(audioCtx.destination);
                o.type = type; o.frequency.value = freq;
                g.gain.setValueAtTime(vol, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                o.start(); o.stop(audioCtx.currentTime + dur);
            } catch(e) {}
        }

        const sfx = {
            shoot: () => tone(820, 0.04, "square", 0.06),
            hit:   () => tone(180, 0.08, "sawtooth", 0.07),
            death: () => { tone(140, 0.12, "triangle", 0.08); tone(90, 0.18, "sine", 0.05); },
            wave:  () => { tone(440, 0.1, "sine", 0.07); tone(660, 0.15, "sine", 0.05); },
            place: () => tone(520, 0.07, "triangle", 0.07),
            up:    () => { tone(600, 0.06); tone(900, 0.1); },
            sell:  () => tone(280, 0.12, "triangle", 0.07),
            boss:  () => { tone(70, 0.35, "sawtooth", 0.1); tone(110, 0.4, "square", 0.07); },
            ice:   () => tone(900, 0.08, "sine", 0.05),
            fire:  () => tone(300, 0.1, "sawtooth", 0.06)
        };

        function saveProgress(data) {
            localStorage.setItem("wobblewalls_save", JSON.stringify(data));
        }
        function loadProgress() {
            try { return JSON.parse(localStorage.getItem("wobblewalls_save")) || null; } catch(e) { return null; }
        }

        // UI
        const overlay = document.getElementById("ui-overlay");
        const usernameInput = document.getElementById("usernameInput");
        const continueBtn = document.getElementById("continueBtn");
        const highscoreText = document.getElementById("highscoreText");

        let playerName = "";
        let highWave = 0;

        const saved = loadProgress();
        if (saved) {
            playerName = saved.username || "";
            highWave = saved.highWave || 0;
            usernameInput.value = playerName;
            highscoreText.innerText = `Best Wave: ${highWave}`;
        }

        continueBtn.onclick = () => {
            const name = usernameInput.value.trim();
            if (!name) {
                usernameInput.style.borderColor = "#ff4444";
                return;
            }
            playerName = name;
            if (audioCtx.state === "suspended") audioCtx.resume();
            startBackgroundMusic();

            overlay.innerHTML = `
                <img src="https://iili.io/CQZ62p9.md.jpg" alt="Wobble Walls" class="logo" style="width:220px;margin-bottom:12px;">
                <div style="font-size:18px;color:#00e5ff;margin-bottom:6px;">SELECT MAP</div>
                <div style="font-size:14px;color:#aaa;margin-bottom:18px;">Welcome, ${playerName}</div>
                <button class="map-btn" data-map="map1">1. Neon Valley</button>
                <button class="map-btn" data-map="map2">2. Cyber Spiral</button>
                <button class="map-btn" data-map="map3">3. Void Corridor</button>
                <div class="highscore">Best Wave: ${highWave}</div>
                <div class="credit">Built by <a href="https://x.com/WoobleStudio" target="_blank">@WoobleStudio</a></div>
            `;
            document.querySelectorAll(".map-btn").forEach(btn => {
                btn.onclick = () => {
                    currentMap = btn.dataset.map;
                    PATH = MAPS[currentMap].path;
                    rebuildSpots();
                    overlay.classList.add("hidden");
                    startGame();
                };
            });
        };

        function startGame() {
            class GameScene extends Phaser.Scene {
                constructor() { super("Game"); }

                preload() {
                    this.load.image("archer", "assets/towers/archer.png");
                    this.load.image("mage", "assets/towers/mage.png");
                    this.load.image("tesla", "assets/towers/tesla.png");
                    this.load.image("cryo", "assets/towers/cryo.png");
                    this.load.image("toxic", "assets/towers/toxic.png");
                    this.load.image("plasma", "assets/towers/plasma.png");
                    this.load.image("beacon", "assets/towers/beacon.png");
                    this.load.image("drone", "assets/towers/drone.png");
                    this.load.image("totem", "assets/towers/totem.png");
                    this.load.image("dragon", "assets/towers/dragon.png");

                    this.load.image("goblin", "assets/enemies/goblin.png");
                    this.load.image("runner", "assets/enemies/runner.png");
                    this.load.image("orc", "assets/enemies/orc.png");
                    this.load.image("bat", "assets/enemies/bat.png");
                    this.load.image("drone_e", "assets/enemies/drone.png");
                    this.load.image("golem", "assets/enemies/golem.png");
                    this.load.image("boss", "assets/enemies/boss.png");
                }

                init() {
                    this.gold = 300;
                    this.mana = 50;
                    this.lives = 25;
                    this.wave = 0;
                    this.enemies = [];
                    this.towers = [];
                    this.bullets = [];
                    this.selected = "archer";
                    this.waveActive = false;
                    this.spawnLeft = 0;
                    this.spawnTimer = 0;
                    this.paused = false;
                    this.speed = 1;
                    this.selectedTower = null;
                    this.gameStarted = false;
                    this.nextWaveText = null;
                }

                create() {
                    this.add.rectangle(W/2, H/2, W, H, 0x050510);

                    const bgGrid = this.add.graphics();
                    bgGrid.lineStyle(1, 0x00e5ff, 0.04);
                    for (let x = 0; x <= W; x += 40) { bgGrid.moveTo(x, 0); bgGrid.lineTo(x, H); }
                    for (let y = 0; y <= H; y += 40) { bgGrid.moveTo(0, y); bgGrid.lineTo(W, y); }
                    bgGrid.strokePath();

                    const sep = this.add.graphics();
                    sep.lineStyle(3, 0xffffff, 0.85);
                    sep.lineBetween(15, 148, W-15, 148);

                    // Path
                    const pathG = this.add.graphics();
                    pathG.lineStyle(40, 0xffffff, 0.1);
                    pathG.beginPath();
                    pathG.moveTo(PATH[0].x, PATH[0].y);
                    for (let i = 1; i < PATH.length; i++) pathG.lineTo(PATH[i].x, PATH[i].y);
                    pathG.strokePath();
                    pathG.lineStyle(22, 0xffffff, 0.95);
                    pathG.beginPath();
                    pathG.moveTo(PATH[0].x, PATH[0].y);
                    for (let i = 1; i < PATH.length; i++) pathG.lineTo(PATH[i].x, PATH[i].y);
                    pathG.strokePath();
                    pathG.lineStyle(12, 0x0a0a18, 1);
                    pathG.beginPath();
                    pathG.moveTo(PATH[0].x, PATH[0].y);
                    for (let i = 1; i < PATH.length; i++) pathG.lineTo(PATH[i].x, PATH[i].y);
                    pathG.strokePath();

                    // Spots
                    const spotG = this.add.graphics();
                    FINAL_SPOTS.forEach(s => {
                        spotG.lineStyle(6, 0x00e5ff, 0.22);
                        spotG.strokeRect(s.x - 26, s.y - 26, 52, 52);
                        spotG.lineStyle(2.5, 0xffffff, 0.9);
                        spotG.strokeRect(s.x - 22, s.y - 22, 44, 44);
                    });

                    this.add.rectangle(W/2, 36, W, 72, 0x08081a, 0.95);
                    this.add.rectangle(W/2, 72, W, 3, 0xffffff, 0.75);

                    this.goldText  = this.add.text(16, 10, "💰 300", { fontSize: "18px", color: "#ffd700", fontStyle: "bold" });
                    this.manaText  = this.add.text(120, 10, "🔵 50", { fontSize: "18px", color: "#66ccff", fontStyle: "bold" });
                    this.livesText = this.add.text(220, 10, "❤️ 25", { fontSize: "18px", color: "#ff4d6d", fontStyle: "bold" });
                    this.waveText  = this.add.text(320, 10, "WAVE 0", { fontSize: "18px", color: "#00e5ff", fontStyle: "bold" });
                    this.nameText  = this.add.text(480, 10, playerName, { fontSize: "16px", color: "#ffffff" });

                    // Tower buttons
                    const keys = Object.keys(TOWERS);
                    keys.forEach((key, i) => {
                        const t = TOWERS[key];
                        const row = i < 5 ? 0 : 1;
                        const col = i % 5;
                        const bx = 70 + col * 120;
                        const by = 100 + row * 48;

                        const box = this.add.rectangle(bx, by, 110, 42, 0x0a0a18);
                        box.setStrokeStyle(2, 0xffffff, 0.9);

                        const btn = this.add.text(bx, by, t.name + "\n" + t.cost + (t.mana > 0 ? " +" + t.mana : ""), {
                            fontSize: "12px", color: "#ffffff", align: "center", fontStyle: "bold"
                        }).setOrigin(0.5).setInteractive({ useHandCursor: true });

                        btn.on("pointerdown", () => {
                            this.selected = key;
                            this.selectedTower = null;
                            this.hideAllRanges();
                            this.upPanel.setVisible(false);
                            this.children.list.forEach(c => {
                                if (c.type === "Rectangle" && (c.height === 42 || c.height === 48)) c.setStrokeStyle(2, 0xffffff, 0.9);
                            });
                            box.setStrokeStyle(3, 0x00e5ff, 1);
                        });
                        if (key === "archer") box.setStrokeStyle(3, 0x00e5ff, 1);
                    });

                    // Controls
                    this.speedBtn = this.add.text(620, 200, "1X", {
                        fontSize: "17px", color: "#ffffff", backgroundColor: "#222244",
                        padding: { x: 12, y: 7 }
                    }).setInteractive({ useHandCursor: true });
                    this.speedBtn.on("pointerdown", () => this.cycleSpeed());

                    this.pauseBtn = this.add.text(620, 250, "❚❚", {
                        fontSize: "17px", color: "#ffffff", backgroundColor: "#442222",
                        padding: { x: 12, y: 7 }
                    }).setInteractive({ useHandCursor: true });
                    this.pauseBtn.on("pointerdown", () => this.togglePause());

                    this.muteBtn = this.add.text(620, 300, "🔊", {
                        fontSize: "17px", color: "#ffffff", backgroundColor: "#223344",
                        padding: { x: 12, y: 7 }
                    }).setInteractive({ useHandCursor: true });
                    this.muteBtn.on("pointerdown", () => {
                        const muted = toggleMute();
                        this.muteBtn.setText(muted ? "🔇" : "🔊");
                    });

                    this.startBtn = this.add.text(W/2, H/2 + 20, "▶  START GAME", {
                        fontSize: "28px", color: "#ffffff", backgroundColor: "#003d2e",
                        padding: { x: 30, y: 16 }
                    }).setOrigin(0.5).setInteractive({ useHandCursor: true });

                    this.startBtn.on("pointerdown", () => {
                        this.startBtn.destroy();
                        this.gameStarted = true;
                        this.startWave();
                    });

                    // Upgrade panel
                    this.upPanel = this.add.container(W/2, H - 110).setVisible(false);
                    const upBg = this.add.rectangle(0, 0, 380, 100, 0x0c0c20, 0.95);
                    upBg.setStrokeStyle(3, 0xffffff, 0.8);
                    this.upText = this.add.text(0, -26, "", { fontSize: "14px", color: "#fff", align: "center" }).setOrigin(0.5);
                    this.upBtn = this.add.text(-85, 24, "UPGRADE", {
                        fontSize: "15px", color: "#00ff9d", backgroundColor: "#003322", padding: { x: 14, y: 7 }
                    }).setOrigin(0.5).setInteractive({ useHandCursor: true });
                    this.upBtn.on("pointerdown", () => this.upgradeSelected());
                    this.sellBtn = this.add.text(85, 24, "SELL", {
                        fontSize: "15px", color: "#ff6b6b", backgroundColor: "#3a1111", padding: { x: 20, y: 7 }
                    }).setOrigin(0.5).setInteractive({ useHandCursor: true });
                    this.sellBtn.on("pointerdown", () => this.sellSelected());
                    this.upPanel.add([upBg, this.upText, this.upBtn, this.sellBtn]);

                    this.input.on("pointerdown", (p) => {
                        if (this.paused) return;
                        if (p.y > 200 && p.y < H - 150) {
                            let clicked = null;
                            for (const tw of this.towers) {
                                if (Phaser.Math.Distance.Between(p.x, p.y, tw.x, tw.y) < 32) {
                                    clicked = tw; break;
                                }
                            }
                            if (clicked) {
                                this.selectedTower = clicked;
                                this.hideAllRanges();
                                clicked.range.setVisible(true);
                                this.showUpgrade(clicked);
                            } else {
                                this.selectedTower = null;
                                this.hideAllRanges();
                                this.upPanel.setVisible(false);
                                this.tryPlace(p.x, p.y);
                            }
                        }
                    });

                    this.add.text(W/2, H/2 - 80, "WOBBLE WALLS", {
                        fontSize: "48px", color: "#00e5ff", fontStyle: "bold"
                    }).setOrigin(0.5).setAlpha(0.18);

                    const g = this.make.graphics({ x: 0, y: 0, add: false });
                    g.fillStyle(0xffffff); g.fillCircle(4, 4, 4);
                    g.generateTexture("flare", 8, 8); g.destroy();
                    this.hitParticles = this.add.particles(0, 0, "flare", {
                        speed: { min: 60, max: 160 }, scale: { start: 0.6, end: 0 },
                        lifespan: 450, blendMode: "ADD", emitting: false
                    });
                }

                hideAllRanges() {
                    this.towers.forEach(tw => { if (tw.range) tw.range.setVisible(false); });
                }

                showDamage(x, y, dmg, color = "#ffffff") {
                    const txt = this.add.text(x, y - 10, Math.floor(dmg), {
                        fontSize: "18px", color: color, fontStyle: "bold",
                        stroke: "#000000", strokeThickness: 3
                    }).setOrigin(0.5);
                    this.tweens.add({
                        targets: txt, y: y - 50, alpha: 0, duration: 700,
                        ease: "Cubic.easeOut", onComplete: () => txt.destroy()
                    });
                }

                cycleSpeed() {
                    this.speed = this.speed === 1 ? 2 : this.speed === 2 ? 3 : 1;
                    this.speedBtn.setText(this.speed + "X");
                }

                togglePause() {
                    this.paused = !this.paused;
                    this.pauseBtn.setText(this.paused ? "▶" : "❚❚");
                    this.pauseBtn.setBackgroundColor(this.paused ? "#225522" : "#442222");
                }

                showUpgrade(tw) {
                    const sellValue = Math.floor(tw.data.cost * 0.6 + (tw.lvl - 1) * tw.data.upCost * 0.5);
                    const elem = tw.data.element || "None";
                    if (tw.lvl >= tw.data.maxLvl) {
                        this.upText.setText(`\( {tw.data.name}  Lv \){tw.lvl}  MAX\nElement: ${elem}\nSell: ${sellValue}`);
                        this.upBtn.setVisible(false);
                    } else {
                        const next = Math.floor(tw.data.dmg * 1.35);
                        this.upText.setText(`\( {tw.data.name}  Lv \){tw.lvl}  [${elem}]\nDMG \( {tw.data.dmg}→ \){next}  Cost ${tw.data.upCost}\nSell: ${sellValue}`);
                        this.upBtn.setVisible(true);
                    }
                    this.upPanel.setVisible(true);
                }

                upgradeSelected() {
                    const tw = this.selectedTower;
                    if (!tw || tw.lvl >= tw.data.maxLvl) return;
                    if (this.gold < tw.data.upCost) return;
                    this.gold -= tw.data.upCost;
                    this.goldText.setText("💰 " + this.gold);
                    tw.lvl++;
                    tw.data.dmg = Math.floor(tw.data.dmg * 1.35);
                    tw.data.range = Math.floor(tw.data.range * 1.12);
                    tw.range.setRadius(tw.data.range);
                    this.tweens.add({ targets: tw.sprite, scale: 1.3, duration: 120, yoyo: true });
                    sfx.up();
                    this.showUpgrade(tw);
                }

                sellSelected() {
                    const tw = this.selectedTower;
                    if (!tw) return;
                    const sellValue = Math.floor(tw.data.cost * 0.6 + (tw.lvl - 1) * tw.data.upCost * 0.5);
                    this.gold += sellValue;
                    this.goldText.setText("💰 " + this.gold);
                    tw.sprite.destroy();
                    tw.range.destroy();
                    const idx = this.towers.indexOf(tw);
                    if (idx > -1) this.towers.splice(idx, 1);
                    this.selectedTower = null;
                    this.upPanel.setVisible(false);
                    sfx.sell();
                }

                tryPlace(x, y) {
                    const t = TOWERS[this.selected];
                    if (this.gold < t.cost || this.mana < t.mana) return;

                    let valid = false, snapX = x, snapY = y;
                    for (const s of FINAL_SPOTS) {
                        if (Phaser.Math.Distance.Between(x, y, s.x, s.y) < 28) {
                            valid = true; snapX = s.x; snapY = s.y; break;
                        }
                    }
                    if (!valid) return;

                    for (const tw of this.towers) {
                        if (Phaser.Math.Distance.Between(snapX, snapY, tw.x, tw.y) < 20) return;
                    }

                    this.gold -= t.cost;
                    this.mana -= t.mana;
                    this.goldText.setText("💰 " + this.gold);
                    this.manaText.setText("🔵 " + this.mana);
                    sfx.place();

                    const sprite = this.add.image(snapX, snapY, t.key).setDisplaySize(48, 48);
                    sprite.setDepth(10);

                    const range = this.add.circle(snapX, snapY, t.range, 0xff0000, 0.15);
                    range.setStrokeStyle(2, 0xff4444, 0.6);
                    range.setVisible(false);

                    this.towers.push({
                        x: snapX, y: snapY,
                        data: Object.assign({}, t),
                        lvl: 1, last: 0,
                        sprite, range
                    });
                }

                startWave() {
                    if (this.waveActive || this.paused) return;
                    this.wave++;
                    this.waveText.setText("WAVE " + this.wave);
                    this.waveActive = true;

                    if (this.wave % 5 === 0) {
                        this.spawnLeft = 1;
                        sfx.boss();
                    } else {
                        this.spawnLeft = 6 + Math.floor(this.wave * 1.8);
                    }
                    this.spawnTimer = 0;
                    sfx.wave();
                }

                showNextWaveText() {
                    if (this.nextWaveText) this.nextWaveText.destroy();
                    const isBossNext = (this.wave + 1) % 5 === 0;
                    this.nextWaveText = this.add.text(W/2, H/2, isBossNext ? "⚠ BOSS WAVE ⚠" : "NEXT WAVE", {
                        fontSize: isBossNext ? "36px" : "42px",
                        color: isBossNext ? "#ff2244" : "#00ff9d",
                        fontStyle: "bold",
                        stroke: "#000",
                        strokeThickness: 6
                    }).setOrigin(0.5);
                    this.tweens.add({
                        targets: this.nextWaveText, alpha: 0, duration: 1400, ease: "Power2",
                        onComplete: () => { if (this.nextWaveText) { this.nextWaveText.destroy(); this.nextWaveText = null; } }
                    });
                }

                spawn() {
                    if (this.wave % 5 === 0) {
                        const d = ENEMIES.boss;
                        const hpMult = 1 + (this.wave / 5) * 0.6;

                        const sprite = this.add.image(PATH[0].x, PATH[0].y, "boss").setDisplaySize(d.size, d.size);
                        sprite.setDepth(5);

                        this.tweens.add({
                            targets: sprite,
                            y: sprite.y - 8,
                            duration: 700,
                            yoyo: true,
                            repeat: -1,
                            ease: "Sine.easeInOut"
                        });

                        this.enemies.push({
                            x: PATH[0].x, y: PATH[0].y,
                            hp: d.hp * hpMult, max: d.hp * hpMult,
                            speed: d.speed, reward: d.reward + this.wave * 15,
                            idx: 0, sprite, slow: 1, dot: 0, burn: 0, isBoss: true
                        });
                        return;
                    }

                    const keys = Object.keys(ENEMIES).filter(k => k !== "boss");
                    let maxIndex = 0;
                    if (this.wave >= 3) maxIndex = 1;
                    if (this.wave >= 5) maxIndex = 2;
                    if (this.wave >= 8) maxIndex = 3;
                    if (this.wave >= 12) maxIndex = 4;
                    if (this.wave >= 18) maxIndex = 5;

                    const key = keys[Phaser.Math.Between(0, maxIndex)];
                    const d = ENEMIES[key];
                    const hpMult = 1 + (this.wave - 1) * 0.18;
                    const speedMult = 1 + Math.min(this.wave * 0.015, 0.6);

                    const sprite = this.add.image(PATH[0].x, PATH[0].y, d.key).setDisplaySize(d.size, d.size);
                    sprite.setDepth(5);

                    this.tweens.add({
                        targets: sprite,
                        y: sprite.y - 4,
                        duration: 500 + Math.random() * 200,
                        yoyo: true,
                        repeat: -1,
                        ease: "Sine.easeInOut"
                    });

                    this.enemies.push({
                        x: PATH[0].x, y: PATH[0].y,
                        hp: d.hp * hpMult, max: d.hp * hpMult,
                        speed: d.speed * speedMult,
                        reward: Math.floor(d.reward * (1 + this.wave * 0.05)),
                        idx: 0, sprite, slow: 1, dot: 0, burn: 0
                    });
                }

                update(time, delta) {
                    if (this.paused || !this.gameStarted) return;
                    delta *= this.speed;

                    if (!this.waveActive && this.enemies.length === 0 && this.wave > 0) {
                        this.showNextWaveText();
                        this.time.delayedCall(1500, () => {
                            if (!this.waveActive) this.startWave();
                        });
                    }

                    if (this.waveActive && this.spawnLeft > 0) {
                        this.spawnTimer += delta;
                        const delay = this.wave % 5 === 0 ? 800 : Math.max(280, 520 - this.wave * 8);
                        if (this.spawnTimer > delay) {
                            this.spawn();
                            this.spawnLeft--;
                            this.spawnTimer = 0;
                        }
                    }

                    for (let i = this.enemies.length - 1; i >= 0; i--) {
                        const e = this.enemies[i];

                        // Element damage over time
                        if (e.dot > 0) e.hp -= e.dot * (delta / 1000);
                        if (e.burn > 0) e.hp -= e.burn * (delta / 1000);

                        const next = PATH[e.idx + 1];
                        if (!next) {
                            this.lives -= e.isBoss ? 5 : 1;
                            this.livesText.setText("❤️ " + this.lives);
                            e.sprite.destroy();
                            this.enemies.splice(i, 1);
                            if (this.lives <= 0) this.gameOver();
                            continue;
                        }

                        const dist = Phaser.Math.Distance.Between(e.x, e.y, next.x, next.y);
                        if (dist < 8) e.idx++;
                        else {
                            const ang = Phaser.Math.Angle.Between(e.x, e.y, next.x, next.y);
                            const spd = e.speed * e.slow;
                            e.x += Math.cos(ang) * spd * delta / 1000;
                            e.y += Math.sin(ang) * spd * delta / 1000;
                            e.sprite.setPosition(e.x, e.y);
                        }

                        if (e.hp <= 0) {
                            this.gold += e.reward;
                            this.mana += Math.floor(e.reward * 0.3);
                            this.goldText.setText("💰 " + this.gold);
                            this.manaText.setText("🔵 " + this.mana);
                            this.hitParticles.setPosition(e.x, e.y);
                            this.hitParticles.explode(e.isBoss ? 30 : 16);
                            if (e.isBoss) this.cameras.main.shake(300, 0.012);
                            e.sprite.destroy();
                            this.enemies.splice(i, 1);
                            sfx.death();
                        }
                    }

                    for (const tw of this.towers) {
                        if (time - tw.last < tw.data.rate / this.speed) continue;
                        if (tw.data.shot === "buff") continue;

                        let target = null, best = tw.data.range;
                        for (const e of this.enemies) {
                            const d = Phaser.Math.Distance.Between(tw.x, tw.y, e.x, e.y);
                            if (d < best) { best = d; target = e; }
                        }
                        if (target) {
                            this.fire(tw, target);
                            tw.last = time;
                            sfx.shoot();

                            // Element sound
                            if (tw.data.element === "Ice") sfx.ice();
                            if (tw.data.element === "Fire") sfx.fire();

                            this.tweens.add({
                                targets: tw.sprite,
                                scaleX: 1.28,
                                scaleY: 1.28,
                                duration: 80,
                                yoyo: true
                            });
                        }
                    }

                    for (let i = this.bullets.length - 1; i >= 0; i--) {
                        const b = this.bullets[i];
                        if (!b.target || !b.target.sprite.active) {
                            b.gfx.destroy();
                            if (b.trail) b.trail.destroy();
                            this.bullets.splice(i, 1);
                            continue;
                        }

                        if (b.type === "laser") {
                            b.life -= delta;
                            if (b.life <= 0) { b.gfx.destroy(); this.bullets.splice(i, 1); }
                            continue;
                        }

                        const ang = Phaser.Math.Angle.Between(b.x, b.y, b.target.x, b.target.y);
                        b.x += Math.cos(ang) * b.spd * delta / 1000;
                        b.y += Math.sin(ang) * b.spd * delta / 1000;
                        b.gfx.setPosition(b.x, b.y);
                        if (b.trail) b.trail.setPosition(b.x, b.y);

                        if (Phaser.Math.Distance.Between(b.x, b.y, b.target.x, b.target.y) < 18) {
                            b.target.hp -= b.dmg;
                            this.showDamage(b.target.x, b.target.y, b.dmg, "#ff6666");

                            // Apply element effects
                            if (b.slow) b.target.slow = Math.min(b.target.slow, b.slow);
                            if (b.dot) b.target.dot = Math.max(b.target.dot, b.dot);
                            if (b.burn) b.target.burn = Math.max(b.target.burn || 0, b.burn);

                            this.hitParticles.setPosition(b.x, b.y);
                            this.hitParticles.explode(10);
                            b.gfx.destroy();
                            if (b.trail) b.trail.destroy();
                            this.bullets.splice(i, 1);
                            sfx.hit();
                        }
                    }

                    if (this.waveActive && this.spawnLeft <= 0 && this.enemies.length === 0) {
                        this.waveActive = false;
                        this.gold += 40 + this.wave * 10;
                        this.mana += 15 + this.wave * 2;
                        this.goldText.setText("💰 " + this.gold);
                        this.manaText.setText("🔵 " + this.mana);
                        this.cameras.main.shake(220, 0.008);

                        if (this.wave > highWave) highWave = this.wave;
                        saveProgress({
                            username: playerName,
                            highWave: highWave,
                            gold: this.gold,
                            mana: this.mana
                        });
                    }
                }

                fire(tw, target) {
                    const type = tw.data.shot;
                    const elem = tw.data.element;

                    if (type === "laser") {
                        const line = this.add.line(0, 0, tw.x, tw.y, target.x, target.y, tw.data.color)
                            .setOrigin(0, 0).setLineWidth(5).setAlpha(0.95);
                        target.hp -= tw.data.dmg;
                        this.showDamage(target.x, target.y, tw.data.dmg, "#ffff00");
                        this.hitParticles.setPosition(target.x, target.y);
                        this.hitParticles.explode(14);
                        this.bullets.push({ type: "laser", gfx: line, life: 140, target });
                        return;
                    }

                    let gfx, trail = null;
                    if (type === "orb" || type === "plasma") {
                        gfx = this.add.circle(tw.x, tw.y, 8, tw.data.color);
                        trail = this.add.circle(tw.x, tw.y, 14, tw.data.color, 0.35);
                    } else if (type === "ice") {
                        gfx = this.add.star(tw.x, tw.y, 5, 4, 8, tw.data.color);
                    } else {
                        gfx = this.add.circle(tw.x, tw.y, 6, 0xffffff);
                        trail = this.add.circle(tw.x, tw.y, 10, tw.data.color, 0.4);
                    }

                    this.bullets.push({
                        x: tw.x, y: tw.y, target,
                        dmg: tw.data.dmg,
                        spd: type === "plasma" ? 360 : 540,
                        slow: tw.data.slow || 0,
                        dot: tw.data.dot || 0,
                        burn: tw.data.burn || 0,
                        gfx, trail, type
                    });
                }

                gameOver() {
                    this.add.rectangle(W/2, H/2, W, H, 0x000000, 0.85);
                    this.add.text(W/2, H/2 - 40, "GAME OVER", {
                        fontSize: "56px", color: "#ff2d55", fontStyle: "bold"
                    }).setOrigin(0.5);
                    this.add.text(W/2, H/2 + 20, `Best Wave: ${highWave}`, {
                        fontSize: "22px", color: "#ffd700"
                    }).setOrigin(0.5);
                    this.add.text(W/2, H/2 + 60, "Refresh to play again", {
                        fontSize: "16px", color: "#aaa"
                    }).setOrigin(0.5);
                    this.input.off("pointerdown");

                    if (this.wave > highWave) highWave = this.wave;
                    saveProgress({
                        username: playerName,
                        highWave: highWave,
                        gold: this.gold,
                        mana: this.mana
                    });
                }
            }

            new Phaser.Game({
                type: Phaser.AUTO,
                width: W,
                height: H,
                parent: "game-container",
                backgroundColor: "#03030a",
                scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
                scene: [GameScene]
            });
        }
    </script>
</body>
</html>
