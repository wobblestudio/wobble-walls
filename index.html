<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Wobble Walls</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: #03030a; width: 100%; height: 100%; overflow: hidden; }
        #game-container { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <script>
        const W = 720;
        const H = 1280;

        const PATH = [
            {x: 360, y: 170},
            {x: 360, y: 300},
            {x: 140, y: 300},
            {x: 140, y: 520},
            {x: 560, y: 520},
            {x: 560, y: 760},
            {x: 200, y: 760},
            {x: 200, y: 1000},
            {x: 360, y: 1000},
            {x: 360, y: 1280}
        ];

        const PLACE_SPOTS = [];
        const SIZE = 50;

        function addLine(x1, y1, x2, y2, side) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const len = Math.sqrt(dx*dx + dy*dy) || 1;
            const steps = Math.max(1, Math.floor(len / SIZE));
            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                let px = x1 + dx * t;
                let py = y1 + dy * t;

                // Larger offset so boxes stay clear of the path
                if (Math.abs(dx) > Math.abs(dy)) {
                    // horizontal → offset up / down
                    py += side * 68;
                } else {
                    // vertical → offset left / right
                    px += side * 68;
                }
                PLACE_SPOTS.push({x: Math.round(px), y: Math.round(py)});
            }
        }

        // Build continuous border with bigger gap
        addLine(360, 180, 360, 300, -1);
        addLine(360, 180, 360, 300,  1);

        addLine(360, 300, 140, 300, -1);
        addLine(360, 300, 140, 300,  1);

        addLine(140, 300, 140, 520, -1);
        addLine(140, 300, 140, 520,  1);

        addLine(140, 520, 560, 520, -1);
        addLine(140, 520, 560, 520,  1);

        addLine(560, 520, 560, 760, -1);
        addLine(560, 520, 560, 760,  1);

        addLine(560, 760, 200, 760, -1);
        addLine(560, 760, 200, 760,  1);

        addLine(200, 760, 200, 1000, -1);
        addLine(200, 760, 200, 1000,  1);

        addLine(200, 1000, 360, 1000, -1);
        addLine(200, 1000, 360, 1000,  1);

        addLine(360, 1000, 360, 1200, -1);
        addLine(360, 1000, 360, 1200,  1);

        const TOWERS = {
            archer:  { name:"ARCHER",  cost:50,  range:165, dmg:16, rate:460,  color:0x00f0ff, upCost:40,  maxLvl:3, shot:"bullet" },
            mage:    { name:"MAGE",    cost:85,  range:145, dmg:13, rate:720,  color:0xff2d95, upCost:65,  maxLvl:3, shot:"orb" },
            tesla:   { name:"TESLA",   cost:130, range:155, dmg:26, rate:900,  color:0xffee00, upCost:95,  maxLvl:3, shot:"laser" },
            cryo:    { name:"CRYO",    cost:100, range:150, dmg:10, rate:650,  color:0x66ccff, upCost:75,  maxLvl:3, shot:"ice", slow:0.5 },
            toxic:   { name:"TOXIC",   cost:110, range:140, dmg:8,  rate:560,  color:0x39ff14, upCost:80,  maxLvl:3, shot:"dot", dot:6 },
            plasma:  { name:"PLASMA",  cost:160, range:180, dmg:40, rate:1100, color:0xff6600, upCost:120, maxLvl:3, shot:"plasma" }
        };

        const ENEMIES = {
            goblin: { hp:60,  speed:80,  reward:10, color:0x39ff14, size:14, shape:"circle" },
            runner: { hp:36,  speed:155, reward:8,  color:0x00ffcc, size:11, shape:"diamond" },
            orc:    { hp:170, speed:46,  reward:24, color:0xff3355, size:18, shape:"square" },
            bat:    { hp:48,  speed:125, reward:14, color:0xb14eff, size:13, shape:"triangle" },
            drone:  { hp:115, speed:66,  reward:18, color:0xffaa00, size:16, shape:"hex" },
            golem:  { hp:320, speed:34,  reward:42, color:0x8888ff, size:24, shape:"square" }
        };

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function tone(freq, dur, type="square", vol=0.07) {
            try {
                const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                o.connect(g); g.connect(audioCtx.destination);
                o.type = type; o.frequency.value = freq;
                g.gain.setValueAtTime(vol, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                o.start(); o.stop(audioCtx.currentTime + dur);
            } catch(e) {}
        }
        const sfx = {
            shoot: () => tone(780, 0.05),
            hit:   () => tone(220, 0.09, "sawtooth"),
            death: () => tone(130, 0.15, "triangle", 0.09),
            wave:  () => { tone(440, 0.1, "sine"); tone(660, 0.16, "sine", 0.05); },
            place: () => tone(560, 0.08, "triangle"),
            up:    () => { tone(620, 0.07); tone(920, 0.11); }
        };

        class GameScene extends Phaser.Scene {
            constructor() { super("Game"); }

            init() {
                this.gold = 250;
                this.lives = 25;
                this.wave = 0;
                this.enemies = [];
                this.towers = [];
                this.bullets = [];
                this.selected = "archer";
                this.waveActive = false;
                this.spawnLeft = 0;
                this.spawnTimer = 0;
                this.paused = false;
                this.speed = 1;
                this.selectedTower = null;
                this.gameStarted = false;
                this.nextWaveText = null;
            }

            create() {
                this.input.once("pointerdown", () => {
                    if (audioCtx.state === "suspended") audioCtx.resume();
                });

                this.add.rectangle(W/2, H/2, W, H, 0x050510);

                const bgGrid = this.add.graphics();
                bgGrid.lineStyle(1, 0x00e5ff, 0.04);
                for (let x = 0; x <= W; x += 40) { bgGrid.moveTo(x, 0); bgGrid.lineTo(x, H); }
                for (let y = 0; y <= H; y += 40) { bgGrid.moveTo(0, y); bgGrid.lineTo(W, y); }
                bgGrid.strokePath();

                // Separator
                const sep = this.add.graphics();
                sep.lineStyle(3, 0xffffff, 0.85);
                sep.lineBetween(15, 148, W-15, 148);

                // PATH
                const pathG = this.add.graphics();
                pathG.lineStyle(44, 0xffffff, 0.1);
                pathG.beginPath();
                pathG.moveTo(PATH[0].x, PATH[0].y);
                for (let i = 1; i < PATH.length; i++) pathG.lineTo(PATH[i].x, PATH[i].y);
                pathG.strokePath();

                pathG.lineStyle(24, 0xffffff, 0.95);
                pathG.beginPath();
                pathG.moveTo(PATH[0].x, PATH[0].y);
                for (let i = 1; i < PATH.length; i++) pathG.lineTo(PATH[i].x, PATH[i].y);
                pathG.strokePath();

                pathG.lineStyle(12, 0x0a0a18, 1);
                pathG.beginPath();
                pathG.moveTo(PATH[0].x, PATH[0].y);
                for (let i = 1; i < PATH.length; i++) pathG.lineTo(PATH[i].x, PATH[i].y);
                pathG.strokePath();

                // Placement squares (now further from path)
                const spotG = this.add.graphics();
                PLACE_SPOTS.forEach(s => {
                    spotG.lineStyle(2.5, 0xffffff, 0.9);
                    spotG.strokeRect(s.x - 23, s.y - 23, 46, 46);
                });

                // Top bar
                this.add.rectangle(W/2, 36, W, 72, 0x08081a, 0.95);
                this.add.rectangle(W/2, 72, W, 3, 0xffffff, 0.75);

                this.goldText  = this.add.text(20, 14, "💰 250", { fontSize: "20px", color: "#ffd700", fontStyle: "bold" });
                this.livesText = this.add.text(150, 14, "❤️ 25", { fontSize: "20px", color: "#ff4d6d", fontStyle: "bold" });
                this.waveText  = this.add.text(280, 14, "WAVE 0", { fontSize: "20px", color: "#00e5ff", fontStyle: "bold" });

                // Tower buttons
                const keys = Object.keys(TOWERS);
                keys.forEach((key, i) => {
                    const t = TOWERS[key];
                    const bx = 60 + i * 110;
                    const by = 105;

                    const box = this.add.rectangle(bx, by, 100, 48, 0x0a0a18);
                    box.setStrokeStyle(3, 0xffffff, 0.9);

                    const btn = this.add.text(bx, by, t.name + "\n" + t.cost, {
                        fontSize: "14px", color: "#ffffff", align: "center", fontStyle: "bold"
                    }).setOrigin(0.5).setInteractive({ useHandCursor: true });

                    btn.on("pointerdown", () => {
                        this.selected = key;
                        this.selectedTower = null;
                        this.upPanel.setVisible(false);
                        this.children.list.forEach(c => {
                            if (c.type === "Rectangle" && c.height === 48) c.setStrokeStyle(3, 0xffffff, 0.9);
                        });
                        box.setStrokeStyle(4, 0x00e5ff, 1);
                    });
                    if (key === "archer") box.setStrokeStyle(4, 0x00e5ff, 1);
                });

                // Speed & Pause
                this.speedBtn = this.add.text(620, 190, "1X", {
                    fontSize: "18px", color: "#ffffff", backgroundColor: "#222244",
                    padding: { x: 14, y: 8 }
                }).setInteractive({ useHandCursor: true });
                this.speedBtn.on("pointerdown", () => this.cycleSpeed());

                this.pauseBtn = this.add.text(620, 250, "❚❚", {
                    fontSize: "18px", color: "#ffffff", backgroundColor: "#442222",
                    padding: { x: 14, y: 8 }
                }).setInteractive({ useHandCursor: true });
                this.pauseBtn.on("pointerdown", () => this.togglePause());

                // START
                this.startBtn = this.add.text(W/2, H/2 + 40, "▶  START GAME", {
                    fontSize: "28px",
                    color: "#ffffff",
                    backgroundColor: "#003d2e",
                    padding: { x: 30, y: 16 }
                }).setOrigin(0.5).setInteractive({ useHandCursor: true });

                this.startBtn.on("pointerdown", () => {
                    this.startBtn.destroy();
                    this.gameStarted = true;
                    this.startWave();
                });

                // Upgrade panel
                this.upPanel = this.add.container(W/2, H - 100).setVisible(false);
                const upBg = this.add.rectangle(0, 0, 340, 80, 0x0c0c20, 0.95);
                upBg.setStrokeStyle(3, 0xffffff, 0.8);
                this.upText = this.add.text(0, -16, "", { fontSize: "15px", color: "#fff", align: "center" }).setOrigin(0.5);
                this.upBtn = this.add.text(0, 20, "UPGRADE", {
                    fontSize: "16px", color: "#00ff9d", backgroundColor: "#003322", padding: { x: 16, y: 7 }
                }).setOrigin(0.5).setInteractive({ useHandCursor: true });
                this.upBtn.on("pointerdown", () => this.upgradeSelected());
                this.upPanel.add([upBg, this.upText, this.upBtn]);

                this.input.on("pointerdown", (p) => {
                    if (this.paused) return;
                    if (p.y > 160 && p.y < H - 140) {
                        let clicked = null;
                        for (const tw of this.towers) {
                            if (Phaser.Math.Distance.Between(p.x, p.y, tw.x, tw.y) < 30) {
                                clicked = tw; break;
                            }
                        }
                        if (clicked) {
                            this.selectedTower = clicked;
                            this.showUpgrade(clicked);
                        } else {
                            this.selectedTower = null;
                            this.upPanel.setVisible(false);
                            this.tryPlace(p.x, p.y);
                        }
                    }
                });

                this.add.text(W/2, H/2 - 60, "WOBBLE WALLS", {
                    fontSize: "48px", color: "#00e5ff", fontStyle: "bold"
                }).setOrigin(0.5).setAlpha(0.3);

                const g = this.make.graphics({ x: 0, y: 0, add: false });
                g.fillStyle(0xffffff); g.fillCircle(4, 4, 4);
                g.generateTexture("flare", 8, 8); g.destroy();
                this.hitParticles = this.add.particles(0, 0, "flare", {
                    speed: { min: 50, max: 140 }, scale: { start: 0.5, end: 0 },
                    lifespan: 400, blendMode: "ADD", emitting: false
                });
            }

            cycleSpeed() {
                this.speed = this.speed === 1 ? 2 : this.speed === 2 ? 3 : 1;
                this.speedBtn.setText(this.speed + "X");
            }

            togglePause() {
                this.paused = !this.paused;
                this.pauseBtn.setText(this.paused ? "▶" : "❚❚");
                this.pauseBtn.setBackgroundColor(this.paused ? "#225522" : "#442222");
            }

            showUpgrade(tw) {
                if (tw.lvl >= tw.data.maxLvl) {
                    this.upText.setText(`\( {tw.data.name}  Lv \){tw.lvl}  MAX`);
                    this.upBtn.setVisible(false);
                } else {
                    const next = Math.floor(tw.data.dmg * 1.35);
                    this.upText.setText(`\( {tw.data.name}  Lv \){tw.lvl}\nDMG ${tw.data.dmg} → ${next}   Cost ${tw.data.upCost}`);
                    this.upBtn.setVisible(true);
                }
                this.upPanel.setVisible(true);
            }

            upgradeSelected() {
                const tw = this.selectedTower;
                if (!tw || tw.lvl >= tw.data.maxLvl) return;
                if (this.gold < tw.data.upCost) return;
                this.gold -= tw.data.upCost;
                this.goldText.setText("💰 " + this.gold);
                tw.lvl++;
                tw.data.dmg = Math.floor(tw.data.dmg * 1.35);
                tw.data.range = Math.floor(tw.data.range * 1.1);
                tw.core.setFillStyle(tw.data.color);
                tw.glow.setRadius(26 + tw.lvl * 4);
                sfx.up();
                this.showUpgrade(tw);
            }

            tryPlace(x, y) {
                const t = TOWERS[this.selected];
                if (this.gold < t.cost) return;

                let valid = false;
                let snapX = x, snapY = y;
                for (const s of PLACE_SPOTS) {
                    if (Phaser.Math.Distance.Between(x, y, s.x, s.y) < 28) {
                        valid = true;
                        snapX = s.x; snapY = s.y;
                        break;
                    }
                }
                if (!valid) return;

                for (const tw of this.towers) {
                    if (Phaser.Math.Distance.Between(snapX, snapY, tw.x, tw.y) < 18) return;
                }

                this.gold -= t.cost;
                this.goldText.setText("💰 " + this.gold);
                sfx.place();

                const base = this.add.circle(snapX, snapY, 17, 0x0a0a18);
                base.setStrokeStyle(3, 0xffffff, 0.9);

                let core;
                if (t.shot === "laser") core = this.add.rectangle(snapX, snapY, 15, 15, t.color).setAngle(45);
                else if (t.shot === "orb" || t.shot === "plasma") core = this.add.circle(snapX, snapY, 11, t.color);
                else if (t.shot === "ice") core = this.add.star(snapX, snapY, 6, 5, 11, t.color);
                else core = this.add.triangle(snapX, snapY, 0, -11, 11, 11, -11, 11, t.color);

                const glow = this.add.circle(snapX, snapY, 24, t.color, 0.3);
                const range = this.add.circle(snapX, snapY, t.range, t.color, 0.05);

                this.towers.push({
                    x: snapX, y: snapY,
                    data: Object.assign({}, t),
                    lvl: 1, last: 0,
                    core, glow, range, base
                });
            }

            startWave() {
                if (this.waveActive || this.paused) return;
                this.wave++;
                this.waveText.setText("WAVE " + this.wave);
                this.waveActive = true;
                this.spawnLeft = 8 + this.wave * 2;
                this.spawnTimer = 0;
                sfx.wave();
            }

            showNextWaveText() {
                if (this.nextWaveText) this.nextWaveText.destroy();
                this.nextWaveText = this.add.text(W/2, H/2, "NEXT WAVE", {
                    fontSize: "42px",
                    color: "#00ff9d",
                    fontStyle: "bold",
                    stroke: "#003322",
                    strokeThickness: 6
                }).setOrigin(0.5);

                this.tweens.add({
                    targets: this.nextWaveText,
                    alpha: 0,
                    duration: 1200,
                    ease: "Power2",
                    onComplete: () => {
                        if (this.nextWaveText) {
                            this.nextWaveText.destroy();
                            this.nextWaveText = null;
                        }
                    }
                });
            }

            spawn() {
                const keys = Object.keys(ENEMIES);
                let key = keys[0];
                if (this.wave >= 3) key = keys[Phaser.Math.Between(0, 1)];
                if (this.wave >= 5) key = keys[Phaser.Math.Between(0, 2)];
                if (this.wave >= 7) key = keys[Phaser.Math.Between(0, 4)];
                if (this.wave >= 10) key = keys[Phaser.Math.Between(0, 5)];

                const d = ENEMIES[key];
                const mult = 1 + (this.wave - 1) * 0.25;

                let body;
                if (d.shape === "square") body = this.add.rectangle(PATH[0].x, PATH[0].y, d.size * 1.7, d.size * 1.7, d.color);
                else if (d.shape === "diamond") body = this.add.rectangle(PATH[0].x, PATH[0].y, d.size * 1.6, d.size * 1.6, d.color).setAngle(45);
                else if (d.shape === "triangle") body = this.add.triangle(PATH[0].x, PATH[0].y, 0, -d.size, d.size, d.size, -d.size, d.size, d.color);
                else body = this.add.circle(PATH[0].x, PATH[0].y, d.size, d.color);

                const ring = this.add.circle(PATH[0].x, PATH[0].y, d.size + 7, d.color, 0.3);
                ring.setStrokeStyle(2, 0xffffff, 0.7);

                this.enemies.push({
                    x: PATH[0].x, y: PATH[0].y,
                    hp: d.hp * mult, max: d.hp * mult,
                    speed: d.speed, reward: d.reward,
                    idx: 0, body, ring, slow: 1, dot: 0
                });
            }

            update(time, delta) {
                if (this.paused || !this.gameStarted) return;
                delta *= this.speed;

                if (!this.waveActive && this.enemies.length === 0 && this.wave > 0) {
                    this.showNextWaveText();
                    this.time.delayedCall(1400, () => {
                        if (!this.waveActive) this.startWave();
                    });
                }

                if (this.waveActive && this.spawnLeft > 0) {
                    this.spawnTimer += delta;
                    if (this.spawnTimer > 520) {
                        this.spawn();
                        this.spawnLeft--;
                        this.spawnTimer = 0;
                    }
                }

                for (let i = this.enemies.length - 1; i >= 0; i--) {
                    const e = this.enemies[i];
                    if (e.dot > 0) e.hp -= e.dot * (delta / 1000);

                    const next = PATH[e.idx + 1];
                    if (!next) {
                        this.lives--;
                        this.livesText.setText("❤️ " + this.lives);
                        e.body.destroy(); e.ring.destroy();
                        this.enemies.splice(i, 1);
                        if (this.lives <= 0) this.gameOver();
                        continue;
                    }

                    const dist = Phaser.Math.Distance.Between(e.x, e.y, next.x, next.y);
                    if (dist < 8) e.idx++;
                    else {
                        const ang = Phaser.Math.Angle.Between(e.x, e.y, next.x, next.y);
                        const spd = e.speed * e.slow;
                        e.x += Math.cos(ang) * spd * delta / 1000;
                        e.y += Math.sin(ang) * spd * delta / 1000;
                        e.body.setPosition(e.x, e.y);
                        e.ring.setPosition(e.x, e.y);
                    }

                    if (e.hp <= 0) {
                        this.gold += e.reward;
                        this.goldText.setText("💰 " + this.gold);
                        this.hitParticles.setPosition(e.x, e.y);
                        this.hitParticles.explode(14);
                        e.body.destroy(); e.ring.destroy();
                        this.enemies.splice(i, 1);
                        sfx.death();
                    }
                }

                for (const tw of this.towers) {
                    if (time - tw.last < tw.data.rate / this.speed) continue;
                    let target = null, best = tw.data.range;
                    for (const e of this.enemies) {
                        const d = Phaser.Math.Distance.Between(tw.x, tw.y, e.x, e.y);
                        if (d < best) { best = d; target = e; }
                    }
                    if (target) {
                        this.fire(tw, target);
                        tw.last = time;
                        sfx.shoot();
                    }
                }

                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    const b = this.bullets[i];
                    if (!b.target || !b.target.body.active) {
                        b.gfx.destroy();
                        if (b.trail) b.trail.destroy();
                        this.bullets.splice(i, 1);
                        continue;
                    }

                    if (b.type === "laser") {
                        b.life -= delta;
                        if (b.life <= 0) { b.gfx.destroy(); this.bullets.splice(i, 1); }
                        continue;
                    }

                    const ang = Phaser.Math.Angle.Between(b.x, b.y, b.target.x, b.target.y);
                    b.x += Math.cos(ang) * b.spd * delta / 1000;
                    b.y += Math.sin(ang) * b.spd * delta / 1000;
                    b.gfx.setPosition(b.x, b.y);
                    if (b.trail) b.trail.setPosition(b.x, b.y);

                    if (Phaser.Math.Distance.Between(b.x, b.y, b.target.x, b.target.y) < 16) {
                        b.target.hp -= b.dmg;
                        if (b.slow) b.target.slow = Math.min(b.target.slow, b.slow);
                        if (b.dot) b.target.dot = Math.max(b.target.dot, b.dot);
                        this.hitParticles.setPosition(b.x, b.y);
                        this.hitParticles.explode(8);
                        b.gfx.destroy();
                        if (b.trail) b.trail.destroy();
                        this.bullets.splice(i, 1);
                        sfx.hit();
                    }
                }

                if (this.waveActive && this.spawnLeft <= 0 && this.enemies.length === 0) {
                    this.waveActive = false;
                    this.gold += 45 + this.wave * 12;
                    this.goldText.setText("💰 " + this.gold);
                }
            }

            fire(tw, target) {
                const type = tw.data.shot;

                if (type === "laser") {
                    const line = this.add.line(0, 0, tw.x, tw.y, target.x, target.y, tw.data.color)
                        .setOrigin(0, 0).setLineWidth(5).setAlpha(0.95);
                    target.hp -= tw.data.dmg;
                    this.hitParticles.setPosition(target.x, target.y);
                    this.hitParticles.explode(12);
                    this.bullets.push({ type: "laser", gfx: line, life: 140, target });
                    return;
                }

                let gfx, trail = null;
                if (type === "orb" || type === "plasma") {
                    gfx = this.add.circle(tw.x, tw.y, 8, tw.data.color);
                    trail = this.add.circle(tw.x, tw.y, 14, tw.data.color, 0.35);
                } else if (type === "ice") {
                    gfx = this.add.star(tw.x, tw.y, 5, 4, 8, tw.data.color);
                } else {
                    gfx = this.add.circle(tw.x, tw.y, 6, 0xffffff);
                    trail = this.add.circle(tw.x, tw.y, 10, tw.data.color, 0.4);
                }

                this.bullets.push({
                    x: tw.x, y: tw.y, target,
                    dmg: tw.data.dmg,
                    spd: type === "plasma" ? 360 : 540,
                    slow: tw.data.slow || 0,
                    dot: tw.data.dot || 0,
                    gfx, trail, type
                });
            }

            gameOver() {
                this.add.rectangle(W/2, H/2, W, H, 0x000000, 0.85);
                this.add.text(W/2, H/2 - 30, "GAME OVER", {
                    fontSize: "56px", color: "#ff2d55", fontStyle: "bold"
                }).setOrigin(0.5);
                this.add.text(W/2, H/2 + 30, "Refresh to restart", {
                    fontSize: "18px", color: "#aaa"
                }).setOrigin(0.5);
                this.input.off("pointerdown");
            }
        }

        new Phaser.Game({
            type: Phaser.AUTO,
            width: W,
            height: H,
            parent: "game-container",
            backgroundColor: "#03030a",
            scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
            scene: [GameScene]
        });
    </script>
</body>
</html>
